basePath: /
definitions:
  peerdrive_internal_model.AnonCollection:
    properties:
      created_at:
        type: string
      entries:
        items:
          $ref: '#/definitions/peerdrive_internal_model.AnonCollectionEntry'
        type: array
      friendly_name:
        type: string
      version:
        type: integer
    type: object
  peerdrive_internal_model.AnonCollectionEntry:
    properties:
      hash:
        type: string
      path:
        type: string
    type: object
  peerdrive_internal_model.AnonCollectionSummary:
    properties:
      created_at:
        type: string
      friendly_name:
        type: string
      hash:
        type: string
      version:
        type: integer
    type: object
  peerdrive_internal_model.FileListItem:
    properties:
      created_at:
        type: string
      filename:
        type: string
      hash:
        type: string
      mime_type:
        type: string
      provider_path:
        type: string
      provider_type:
        type: string
      size:
        type: integer
      type:
        type: string
    type: object
host: localhost:3000
info:
  contact: {}
  description: P2P file sharing with content-addressable storage, collection management,
    versioning, merge/fork/pull.
  title: Peerdrive API
  version: "1.0"
paths:
  /{username}/{collection_name}/{filepath}:
    get:
      description: Look up the path in the collection's entries and redirect to /sha256sum/{hash}
        for download
      parameters:
      - description: Username
        in: path
        name: username
        required: true
        type: string
      - description: Collection name
        in: path
        name: collection_name
        required: true
        type: string
      - description: File path within the collection
        in: path
        name: filepath
        required: true
        type: string
      produces:
      - application/octet-stream
      responses:
        "200":
          description: File content
          schema:
            type: file
        "404":
          description: Collection or file not found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Download a file from a collection
      tags:
      - collections
  /actions/fork:
    post:
      consumes:
      - application/json
      description: Copy all entries from a source collection into a new collection
        owned by a different user.
      parameters:
      - description: Fork request
        in: body
        name: body
        required: true
        schema:
          properties:
            collection_name:
              type: string
            source_coll_name:
              type: string
            source_username:
              type: string
            username:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: forked, id, username, collection_name, entries_count
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Source collection not found
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Local collection already exists
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Fork a collection
      tags:
      - actions
  /actions/merge:
    post:
      consumes:
      - application/json
      description: 'Merge entries from source collection into local. Strategy: "ours"
        keeps local, "theirs" accepts source, "manual" returns conflicts list.'
      parameters:
      - description: Merge request
        in: body
        name: body
        required: true
        schema:
          properties:
            collection_name:
              type: string
            source_coll_name:
              type: string
            source_username:
              type: string
            strategy:
              type: string
            username:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: merge complete
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Collection not found
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: conflicts list (when strategy=manual)
          schema:
            additionalProperties: true
            type: object
      summary: Merge a source collection into the local collection
      tags:
      - actions
  /actions/pull:
    post:
      consumes:
      - application/json
      description: Placeholder for syncing upstream changes from a forked source.
        Currently returns a no-op task.
      parameters:
      - description: Pull request
        in: body
        name: body
        required: true
        schema:
          properties:
            collection_name:
              type: string
            username:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: message
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Pull upstream updates (placeholder)
      tags:
      - actions
  /anon/collections:
    get:
      description: Returns all anonymous collections known to this node (from file_meta).
      produces:
      - application/json
      responses:
        "200":
          description: List of collections
          schema:
            items:
              $ref: '#/definitions/peerdrive_internal_model.AnonCollectionSummary'
            type: array
      summary: List anonymous collections
      tags:
      - anon
    post:
      consumes:
      - application/json
      description: Create an immutable content-addressed collection with file entries.
        Entries validated for path traversal and valid SHA256 hashes.
      parameters:
      - description: Collection entries
        in: body
        name: body
        required: true
        schema:
          properties:
            entries:
              items:
                properties:
                  hash:
                    type: string
                  path:
                    type: string
                type: object
              type: array
            friendly_name:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "201":
          description: hash
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Invalid request or invalid path/hash
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Create anonymous collection
      tags:
      - anon
  /anon/collections/{hash}:
    get:
      description: Retrieve an anonymous collection's metadata and entries.
      parameters:
      - description: Collection SHA256 hash
        in: path
        name: hash
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Collection
          schema:
            $ref: '#/definitions/peerdrive_internal_model.AnonCollection'
        "404":
          description: Collection not found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get anonymous collection by hash
      tags:
      - anon
  /anon/collections/{hash}/{filepath}:
    get:
      description: Download a specific file entry from an anonymous collection by
        hash and file path.
      parameters:
      - description: Collection SHA256 hash
        in: path
        name: hash
        required: true
        type: string
      - description: File path within collection
        in: path
        name: filepath
        required: true
        type: string
      produces:
      - application/octet-stream
      responses:
        "200":
          description: File content
          schema:
            type: file
        "404":
          description: Collection or file not found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Download file from anonymous collection
      tags:
      - anon
  /anon/collections/commit:
    post:
      consumes:
      - application/json
      description: Commit modifications to an existing anonymous collection. Accepts
        a list of entries to add/update (non-empty hash) or remove (empty hash). Increments
        version and generates a new content hash.
      parameters:
      - description: Commit parameters
        in: body
        name: body
        required: true
        schema:
          properties:
            commit_message:
              type: string
            entries:
              items:
                properties:
                  hash:
                    type: string
                  path:
                    type: string
                type: object
              type: array
            source_hash:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "201":
          description: hash
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Invalid request or invalid path/hash
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Source collection not found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Commit anonymous collection (versioned)
      tags:
      - anon
  /anon/collections/fork:
    post:
      consumes:
      - application/json
      description: Create a variant of an anonymous collection by adding and/or removing
        file entries.
      parameters:
      - description: Fork parameters
        in: body
        name: body
        required: true
        schema:
          properties:
            add_entries:
              items:
                properties:
                  hash:
                    type: string
                  path:
                    type: string
                type: object
              type: array
            friendly_name:
              type: string
            remove_paths:
              items:
                type: string
              type: array
            source_hash:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "201":
          description: hash
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Invalid request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Source collection not found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Fork anonymous collection
      tags:
      - anon
  /collections:
    post:
      consumes:
      - application/json
      description: Create a named collection for a user. Duplicate (username, collection_name)
        returns 409.
      parameters:
      - description: Username and collection name
        in: body
        name: body
        required: true
        schema:
          properties:
            collection_name:
              type: string
            username:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: id, username, collection_name
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid request
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Duplicate
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Create a new collection
      tags:
      - collections
  /collections/{username}:
    get:
      description: Returns all collections owned by the given username
      parameters:
      - description: Username
        in: path
        name: username
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: data array of collections
          schema:
            additionalProperties: true
            type: object
      summary: List collections for a user
      tags:
      - collections
  /collections/{username}/{collection_name}:
    get:
      description: Returns collection metadata and its path→hash entries
      parameters:
      - description: Username
        in: path
        name: username
        required: true
        type: string
      - description: Collection name
        in: path
        name: collection_name
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: collection and entries
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get collection details with entries
      tags:
      - collections
  /collections/{username}/{collection_name}/commit:
    post:
      consumes:
      - application/json
      description: Snapshot all current entries into a version with a commit message.
        Creates a linked version chain.
      parameters:
      - description: Username
        in: path
        name: username
        required: true
        type: string
      - description: Collection name
        in: path
        name: collection_name
        required: true
        type: string
      - description: Commit message
        in: body
        name: body
        required: true
        schema:
          properties:
            commit_message:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: message, version_number, snapshot_hash
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Collection not found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Commit collection entries as a new version
      tags:
      - collections
  /collections/{username}/{collection_name}/entries:
    post:
      consumes:
      - application/json
      description: Map a path (e.g. "dir/file.txt") to a SHA256 hash within a collection.
        Creates the collection if it doesn't exist.
      parameters:
      - description: Username
        in: path
        name: username
        required: true
        type: string
      - description: Collection name
        in: path
        name: collection_name
        required: true
        type: string
      - description: Entry path and file hash
        in: body
        name: body
        required: true
        schema:
          properties:
            hash:
              type: string
            path:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: message
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Invalid request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Add an entry to a collection
      tags:
      - collections
  /collections/{username}/{collection_name}/entries/{path}:
    delete:
      description: Delete a path→hash mapping from a collection
      parameters:
      - description: Username
        in: path
        name: username
        required: true
        type: string
      - description: Collection name
        in: path
        name: collection_name
        required: true
        type: string
      - description: Entry path (URL-encoded)
        in: path
        name: path
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: message
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Collection not found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Remove an entry from a collection
      tags:
      - collections
  /collections/{username}/{collection_name}/log:
    get:
      description: Returns all committed versions for a collection, newest first
      parameters:
      - description: Username
        in: path
        name: username
        required: true
        type: string
      - description: Collection name
        in: path
        name: collection_name
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: data array of versions
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Collection not found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get collection version history
      tags:
      - collections
  /collections/{username}/{collection_name}/rollback/{version_id}:
    post:
      description: Restore collection entries from a specific version's snapshot.
        Replaces all current entries.
      parameters:
      - description: Username
        in: path
        name: username
        required: true
        type: string
      - description: Collection name
        in: path
        name: collection_name
        required: true
        type: string
      - description: Version ID to restore
        in: path
        name: version_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: message
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Invalid version_id
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Collection not found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Rollback collection to a previous version
      tags:
      - collections
  /collections/{username}/{collection_name}/visibility:
    post:
      consumes:
      - application/json
      description: Change the visibility of a collection (public, unlisted, private)
      parameters:
      - description: Username
        in: path
        name: username
        required: true
        type: string
      - description: Collection name
        in: path
        name: collection_name
        required: true
        type: string
      - description: 'Visibility: public|unlisted|private'
        in: body
        name: body
        required: true
        schema:
          properties:
            visibility:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: ok
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: error
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Set collection visibility
      tags:
      - collections
  /collections/public:
    get:
      description: Returns all collections with visibility = 'public', optionally
        filtered by search query
      parameters:
      - description: Search query
        in: query
        name: q
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: data array of collections
          schema:
            additionalProperties: true
            type: object
      summary: List all public collections
      tags:
      - collections
  /collections/search:
    get:
      description: Search collections by username or collection name
      parameters:
      - description: Search query
        in: query
        name: q
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: data array of collections
          schema:
            additionalProperties: true
            type: object
      summary: Search collections
      tags:
      - collections
  /files:
    get:
      description: Returns all registered files with provider info. Supports sort
        by time, name, path, type, size.
      parameters:
      - default: time
        description: 'Sort field: time|name|path|type|size'
        in: query
        name: sort
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/peerdrive_internal_model.FileListItem'
            type: array
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: List all registered files
      tags:
      - files
  /ping:
    get:
      description: Returns "pong" to confirm the server is running
      produces:
      - text/plain
      responses:
        "200":
          description: pong
          schema:
            type: string
      summary: Health check
      tags:
      - health
  /tasks:
    get:
      description: Returns an empty task list
      produces:
      - application/json
      responses:
        "200":
          description: tasks array
          schema:
            additionalProperties: true
            type: object
      summary: List all tasks (stub)
      tags:
      - tasks
  /tasks/{id}:
    get:
      description: Query the status and result of an async task (e.g., pull)
      parameters:
      - description: Task ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: task details
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid task ID
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get task status by ID
      tags:
      - tasks
swagger: "2.0"
