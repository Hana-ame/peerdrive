name: Peerdrive CI

on:
  push:
    # refactor 是当前主干开发分支（见 AGENTS.md 源码控制约定），必须带 CI。
    # 模块分支与角色分支一并覆盖：每个分支都要能跑通自己的 CI/CD 再 merge。
    branches:
      - main
      - master
      - refactor
      - base
      - docs
      - "feat/*"
      - "fix/*"
      - "module/*"
      - "*-agent"
      - "*-frontend"
    # 打 tag 也要跑全量：以前只列 branches，push tag 触发不到本 workflow，
    # 发版路径上等于没有 CI（2026-09-20 补）。branches 与 tags 是「或」关系，
    # 满足任一即触发，不会互相排斥。
    tags: ['v*']
  pull_request:
    branches: [main, master, refactor]

jobs:
  doc-refs:
    # 文档里的 `路径` 和 `文件.go:行号` 引用是否还对得上代码。
    #
    # 为什么值得单独一个 job：2026-10-06 连续两轮修文档都漏了同一类问题。
    #   第一轮查「路径存在吗」→ 漏了裸写的 `main.go:行号`（换了文件名没换行号）
    #   第二轮查「行号越界吗」→ 漏了「行号有效但内容已变」（心跳写 30s 实际 5s）
    # 两次的教训是存在性检查证明不了「说的是不是那件事」。
    # 这个 job 只能守住前一半（越界/缺失），后一半仍需人读——
    # 但守住前一半就已经能挡住最贵的一类：读者点开发现路径没了。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 文档引用体检
        run: node scripts/check-doc-refs.mjs

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: back
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: back/go.sum
      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('back/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-
      - run: go mod download
      - run: go vet -tags nosqlite ./...
      - name: 依赖分层守卫 (LAYERS.md / REFACTOR §8)
        run: bash ../scripts/check-layer-deps.sh
      - run: go test -tags nosqlite ./... -count=1
      # 部署一致性闸门（2026-10-06 新增）。三处约定都在这个模块里：
      #   1. 所有硬编码的信令 key 必须是同一个值（漏改 → 客户端连不上生产）；
      #   2. 面板 key 必须写在 panel/ 源文件里，而不是 dist/ 或内嵌副本（会被构建覆盖）；
      #   3. back/internal/panel/ 的内嵌副本必须与 packages/…/dist/ 逐字节相同。
      # 放在 backend job 而不是 client-package：这三件事的修改者多半只碰 Go/面板两边，
      # 早一步在 go test 里看到，比等 Node 那条链路快得多。
      - run: go test -tags nosqlite ./test/deployconsistency/ -count=1
      # 单二进制：主服务 / 信令 / 注册认证都在 cmd/peerdrive 里（子命令）。
      # vet 与 test 已被上面的 ./... 覆盖，构建这一步不覆盖的话它能过测却编不出二进制
      # ——入口侧的链接错误只有真链一次才暴露。
      - run: go build -tags nosqlite -o peerdrive ./cmd/peerdrive/

  # 集成测试：脱外网（TestMain 起全局自托管信令 + 同机 WebRTC），不需要任何代理/凭证。
  # 必须 -p 1：多组测试共享同一个全局自托管信令服务，并行会互相干扰（见 AGENTS.md）。
  integration:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: back
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: back/go.sum
      - run: go mod download
      # 外网用例（公共 MQTT broker / 线上信令）在 CI 里显式不开门：默认门控关闭即跳过
      - run: go test -tags "nosqlite integration" ./test/integration/ -count=1 -p 1 -timeout 10m

  # 路径穿透与安全探针：包含四层穿透矩阵、真实节点二进制路径穿透探针与外部共享目录全链路验证。
  security-probes:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: back/go.sum
      - name: 四层穿透测试矩阵 (162 条)
        run: cd back && go test -tags nosqlite -run TestTraversal ./internal/... -count=1
      - name: 真实节点路径穿透探针
        run: bash scripts/netdisk-traversal-probe.sh
      - name: storage 外部共享目录全链路验证
        run: bash scripts/netdisk-sharedir-outside.sh

  # back/peerjs 是独立 go.mod（模块 github.com/Hana-ame/go-peerjs，主仓 replace 指向本地），
  # back 目录的 go test ./... 不会覆盖它，必须单独跑——否则改动只同步到主 repo 却从未 CI。
  peerjs:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: back/peerjs
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - run: go vet ./...
      - run: go test ./... -count=1

  # packages/peerdrive-media：21 个用例（含 wrtc 的 node↔node E2E），dist 入库前必跑。
  media-package:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/peerdrive-media
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/peerdrive-media/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  # packages/peerdrive-client：纯 WebRTC 消费端（61 个用例，覆盖协议状态机 +
  # 增量 SHA-256）。刻意零依赖——所以这里不需要 npm ci：没有 lock 文件、
  # 没有网络安装步骤，CI 只跑 node --test。
  # 另外校验两件事，都是「忘了重新生成就会发出过期产物」这一类漂移：
  #   1. dist/panel.html 与 src/ 一致（它是内联单文件，改了 src 忘了 build
  #      就会发出过期的面板）；
  #   2. dist/peerjs.min.js 的 sha256 与 vendor-peerjs.mjs 里记录的期望值一致
  #      ——**这一条是 2026-10-06 新增的**：该文件从 2026-10-06 起被 go:embed
  #      进二进制（back/internal/panel/），内嵌了一份副本。副本与 dist/ 两处
  #      不一致的话，内嵌进用户手上的面板连不上，且本地毫无征兆。
  client-package:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/peerdrive-client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: npm run check:panel
      - name: 校验内嵌进二进制的 panel/peerjs 副本与 dist/ 一致
        run: |
          set -euo pipefail
          fail=0
          for f in panel.html peerjs.min.js; do
            a="dist/$f"; b="../../back/internal/panel/$f"
            if [ ! -f "$b" ]; then echo "缺失: $b"; fail=1; continue; fi
            if cmp -s "$a" "$b"; then
              echo "一致: $f"
            else
              echo "不一致: $a vs $b —— 重新执行 npm run vendor:peerjs 并同步复制"
              fail=1
            fi
          done
          [ "$fail" = 0 ]

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: front/package-lock.json
      - run: npm ci
      - name: 校验 pd-client 内嵌副本已删除（防回归）
        run: test ! -d src/lib/pd-client
      - run: npm test
      - run: npm run build

