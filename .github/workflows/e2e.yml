name: E2E

# 端到端验收：真的起一个自托管信令 + 两个节点，把「市场 → 加入 → 清单 → 拉取 →
# sha256 校验」跑一遍，再用真实浏览器打开面板点一遍。
#
# 为什么必须有它：单元/集成全绿不等于链路可用 —— 2026-09-20 那两个致命缺陷
# （join 落盘 ENOENT、RegisterLocal 没写 file_index 导致共享清单恒为空）
# 就是藏在这条组合路径里，所有单测照样是绿的。详见 doc/testing/README.md §4。
on:
  push:
    branches: [refactor]
    paths:
      - 'back/**'
      - 'packages/peerdrive-client/**'
      - 'scripts/netdisk-local-demo.sh'
      - 'front/tests/**'
      - '.github/workflows/e2e.yml'
  pull_request:
    branches: [main, master, refactor]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  netdisk:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 预下载 go 依赖
        working-directory: back
        run: go mod download

      - name: 构建面板产物
        working-directory: packages/peerdrive-client
        run: npm run build:panel && npm run check:panel

      - name: 起链路环境并跑断言
        # 注意这两点，都是本地实测踩出来的：
        # 1) 脚本用 setsid nohup 起的服务会持有管道写端，直接 `bash ... | tail`
        #    会一直不返回 ⇒ 输出重定向到文件并让它在后台跑，再轮询文件内容。
        # 2) 判断结束不能只看进程退出，要看输出里出现了「== 结果 ==」。
        run: |
          set -uo pipefail
          ( bash scripts/netdisk-local-demo.sh > /tmp/e2e-chain.out 2>&1 </dev/null & )
          for i in $(seq 1 90); do
            grep -q "== 结果 ==" /tmp/e2e-chain.out 2>/dev/null && break
            sleep 2
          done
          cat /tmp/e2e-chain.out
          grep -q "== 结果 ==" /tmp/e2e-chain.out || { echo "::error::链路脚本没跑完"; exit 1; }
          if grep -q "FAIL" /tmp/e2e-chain.out; then echo "::error::链路断言失败"; exit 1; fi

      - name: 管理面冒烟（本地 WS admin 全链路）
        # front/tests/e2e-admin-smoke.mjs 走 Node 22 原生 WebSocket 打本机
        # :3000/ws/peer，验 admin verb 的转发（含二进制上传帧）——不需要外网、
        # 不需要 npm ci，之前只是没人把它接进 CI（doc/testing/README.md §2 第 8 项）。
        # ⚠️ /ws/peer 这段路由归 peerjs 路由组，所以 PEERDRIVE_PEERJS_ENABLE
        #    必须是 true（关掉时该路径直接 404，脚本会静默 0 断言地退出）。
        env:
          PORT: "3000"
          PEERDRIVE_STORAGE: /tmp/pdadmin/root
          PEERDRIVE_DOWNLOAD_DIR: /tmp/pdadmin/root/downloads
          PEERDRIVE_SHARE_ENABLE: "true"
          PEERDRIVE_SHARE_DIRS: /tmp/pdadmin/root/downloads/shared
          PEERDRIVE_PEERJS_ENABLE: "true"
          PEERDRIVE_PEERJS_HOST: 127.0.0.1
          PEERDRIVE_PEERJS_PORT: "9100"
          PEERDRIVE_PEERJS_KEY: peerjs
          PEERDRIVE_PEERJS_SECURE: "false"
          PEERDRIVE_PEERJS_ID: admin-smoke
          PEERDRIVE_BT_DHT_ENABLE: "false"
          PEERDRIVE_IPFS_GATEWAY_ENABLE: "false"
        run: |
          set -u
          mkdir -p /tmp/pdadmin/root/downloads/shared
          ( setsid nohup /tmp/pddemo/bin/server > /tmp/pdadmin/admin.log 2>&1 </dev/null & echo $! > /tmp/pdadmin/pid )
          for i in $(seq 1 40); do
            if curl -sf http://127.0.0.1:3000/ping > /tmp/pdadmin/ping.txt; then
              echo "admin 节点就绪（第 $i 次探测）"; break
            fi
            sleep 2
          done
          cat /tmp/pdadmin/ping.txt
          grep -q pong /tmp/pdadmin/ping.txt || { echo "::error::admin 节点没起来"; tail -30 /tmp/pdadmin/admin.log; exit 1; }
          node front/tests/e2e-admin-smoke.mjs

      - name: 装浏览器（面板 e2e 用）
        run: |
          mkdir -p /tmp/pw && cd /tmp/pw
          npm init -y >/dev/null 2>&1
          npm i playwright --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: 零配置面板自检（v0.3.2：零参数打开 /panel）
        # 这条断言的是 v0.3.2 的头号承诺：**面板自己认出所在节点并连上**，
        # 用户不用手填 node/host/port/key。所以这里刻意**不带任何参数**。
        #
        # 断言方式不是匹配「已连接 / 在线」这类正文——面板界面上
        # 「在线节点」「连接节点」这些**标签文字本身就含这些字**，
        # 早先的用例因此永远绿（第四个「永远绿的测试」）。
        # 现在断言的是：搜出来的节点 id **等于** 本节点的 id。标签文字匹配不上它。
        #
        # 需要一个**自己的、不带 PSK 的**节点：上面的链路脚本第 [6] 步把 node-a
        # 重启成了带 PSK 的节点，而 PSK 门禁的时序问题正是本 workflow 里
        # 那条 known-flaky 的内容（见下一个 step 的注释）。这两条互不干扰：
        # 本 step 用独立的普通节点，known-flaky 仍原样保留，未做任何放宽。
        working-directory: /tmp/pw
        env:
          PANEL_URL: http://127.0.0.1:3000/panel
          PW_CHANNEL: chromium
          TIMEOUT: 60000
        run: |
          set -o pipefail
          # 自己编一份，不复用链路脚本那份：那个位于 $DEMO_DIR/bin/server，
          # 而 DEMO_DIR 是脚本内部的临时路径，这里拿不到也不该依赖它。
          ( cd "$GITHUB_WORKSPACE/back" && \
            go build -tags nosqlite -o /tmp/pdzero/peerdrive ./cmd/peerdrive/ )
          mkdir -p /tmp/pdzero/run
          cd /tmp/pdzero/run
          env PORT=3000 \
            PEERDRIVE_PEERJS_ID=node-zero \
            PEERDRIVE_STORAGE=/tmp/pdzero/root \
            PEERDRIVE_DOWNLOAD_DIR=/tmp/pdzero/root/downloads \
            PEERDRIVE_PEERJS_ENABLE=true \
            PEERDRIVE_PEERJS_HOST=127.0.0.1 \
            PEERDRIVE_PEERJS_PORT=9100 \
            PEERDRIVE_PEERJS_KEY=peerjs \
            PEERDRIVE_PEERJS_SECURE=false \
            PEERDRIVE_DISCOVER_URL=http://127.0.0.1:9100 \
            PEERDRIVE_BT_DHT_ENABLE=false \
            PEERDRIVE_IPFS_GATEWAY_ENABLE=false \
            PEERDRIVE_SWAGGER=off \
            PEERDRIVE_ALLOW_NO_AUTH=1 \
            /tmp/pdzero/peerdrive > /tmp/pdzero/node.log 2>&1 &
          echo $! > /tmp/pdzero/node.pid
          # 先确认**监听者就是自己刚起的那个**：曾经有一次旧二进制占着端口，
          # 验证脚本打的是它，结论整个反过来。
          for i in $(seq 1 60); do
            curl -sf -m 2 http://127.0.0.1:3000/ping >/dev/null 2>&1 && break
            sleep 1
          done
          curl -sf -m 5 http://127.0.0.1:3000/ping | grep -q pong \
            || { echo "::error::零配置面板用的节点没起来"; tail -30 /tmp/pdzero/node.log; exit 1; }
          # ⚠️ 必须先 cd 回装 playwright 的目录再跑：
          # 脚本用 createRequire(process.cwd()) 解析 playwright-core，
          # 上面为了给节点一个独立 cwd（peerdrive.db 落在 cwd 下）已经 cd 走了，
          # 留在那儿会以「需要 playwright-core」退出码 2 结束 —— 首跑就是这么红的。
          cd /tmp/pw
          node "$GITHUB_WORKSPACE/packages/peerdrive-client/scripts/verify-panel-zero-config.mjs" 2>&1 |
            tee /tmp/panel-zero.log

      - name: 上传零配置面板自检日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: panel-zero-config-log
          path: /tmp/panel-zero.log
          if-no-files-found: warn

      - name: 面板端到端（真实浏览器点一遍）
        # 在同一个 runner 上复用上面那套环境：file:// 页面 + ws://127.0.0.1:9100
        # （混合内容规则只拦 HTTPS 页面，file:// 不受限，所以 ws 就够）
        working-directory: /tmp/pw
        env:
          SIG_HOST: 127.0.0.1
          SIG_PORT: 9100
          NODE_ID: node-a
          PW_CHANNEL: chromium
          # 链路脚本第 [6] 步把 node-a 重启成了「带 PSK」的节点，所以面板必须
          # 出示同一把密钥 —— 顺带把"浏览器带密钥过门禁"也纳进 E2E。
          PSK: demo-psk
        # 输出同时落盘：这一步是全仓库最慢、也最容易偶发红的一步，而 Actions 的
        # 日志**下载需要仓库 admin 权限**（匿名 API 拿不到）——留一份 artifact 才能
        # 在红了之后看到面板自己的日志与断言，而不是只能看到"这步失败了"。
        #
        # ✅ 已修复（2026-10-06，commit 0a2f09a）。此前这里记为 known-flaky，
        # 签名是固定的 4 条 PSK 断言：
        #     FAIL #shares 没有清单行
        #     FAIL API 拉取失败：… psk: this node requires a pre-shared key
        #     FAIL 本地入库没有走到「入库完成」
        #     FAIL 网络入库失败了，但不是 SSRF 拒绝
        # 同时 `RESULT: 4 FAILED`，且链路上「已建立 WebRTC 直连」是成功的
        # —— 连接是通的，只有动词被门禁打回。
        #
        # 真正的原因不是注释里猜测的「CDN 抖动」，而是**协议层的门禁竞态**：
        # 服务端 conn.go 的 pskGate 拒绝一切动词直到处理完 psk-auth，
        # 而客户端 _sendPskAuth 是 fire-and-forget（发出后只记 'sent'，不等回执）。
        # 连接刚 open 就发 share 时，share 先到、门禁还关着 → PSK_REQUIRED。
        # DataChannel 的有序性只保证入队后先后，不保证「psk-auth 已被对端消费」。
        #
        # 修法（就是本注释原先写的「正确修法」，现已实现）：客户端发动词前
        # 等 psk-ok 落定，见 packages/peerdrive-client/src/client.js 的
        # _awaitPskGate / _send。配套修掉 _sendPskAuth 的一个真 bug：
        # 原来是先 send 再置 'sent'，同步回执会把 'ok' 覆盖回 'sent'。
        #
        # 修复后本步骤 RESULT: ALL PASS，已连续稳定。
        #
        # 保留原记录的意义：提醒「红了先 rerun 复核，不要动断言」这条纪律本身
        # 是对的——但它不能替代查清机制。**连续 3 次同样签名就不是 flaky**，
        # 应当去读代码，而不是把「偶发」当成结论。
        run: |
          set -o pipefail
          node "$GITHUB_WORKSPACE/packages/peerdrive-client/scripts/verify-panel.mjs" 2>&1 |
            tee /tmp/panel-e2e.log

      - name: 上传面板自检日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: panel-e2e-log
          path: /tmp/panel-e2e.log
          if-no-files-found: warn

      - name: 收尾
        if: always()
        run: |
          bash scripts/netdisk-local-demo.sh --stop || true
          kill "$(cat /tmp/pdadmin/pid 2>/dev/null)" 2>/dev/null || true
          echo "=== admin.log ==="; tail -20 /tmp/pdadmin/admin.log 2>/dev/null || true
          echo "=== node-a.log ==="; tail -30 /tmp/pddemo/a.log 2>/dev/null || true
          echo "=== node-b.log ==="; tail -30 /tmp/pddemo/b.log 2>/dev/null || true
          echo "=== signal.log ==="; tail -20 /tmp/pddemo/signal.log 2>/dev/null || true
