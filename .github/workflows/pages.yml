name: Deploy UI to Pages

# 把 front/ 的完整 React UI（网盘样式：Drive/市场/节点/合集/设置）部署成 GitHub Pages 站点。
# 产物 = vite build --base=/peerdrive/ 的 dist/ + SPA 404 fallback（/drive /market 等前端路由
# 刷新时不 404）。2026-09-24 从「单文件公共面板 panel.html」改为完整网盘 UI。
on:
  push:
    branches: [refactor]
    paths:
      - 'front/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 只允许一个部署同时进行；排队中的运行不取消（避免把正在发布的部署掐断）
concurrency:
  group: pages
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: front/package-lock.json

      - name: Build full UI (netdisk style)
        working-directory: front
        run: |
          npm ci
          npx vite build --base=/peerdrive/

      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r front/dist/* _site/
          # SPA fallback：前端路由（/drive /market /peers ...）刷新由 GH Pages 的 404 兜底
          cp front/dist/index.html _site/404.html
          # Pages 默认带 Jekyll；.nojekyll 关掉，避免下划线路径被吞
          touch _site/.nojekyll
          printf 'User-agent: *\nDisallow: /\n' > _site/robots.txt
          ls -la _site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # 部署完回头验线上：等 Pages 传播后核对「title 是完整 UI」+「本次构建的 JS 指纹」
  verify:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build to get expected fingerprint
        working-directory: front
        run: |
          npm ci
          npx vite build --base=/peerdrive/ --emptyOutDir

      - name: Verify live site
        run: |
          URL="https://hana-ame.github.io/peerdrive/"
          WANT_JS=$(grep -oE 'assets/index-[A-Za-z0-9_-]+\.js' front/dist/index.html | head -1)
          echo "expected JS: $WANT_JS"
          fresh=0
          for i in $(seq 1 10); do
            BODY=$(curl -sfL "$URL" || true)
            TITLE=$(echo "$BODY" | grep -o '<title>[^<]*</title>' | head -1)
            GOT_JS=$(echo "$BODY" | grep -oE 'assets/index-[A-Za-z0-9_-]+\.js' | head -1)
            echo "第 $i 次探测：title=$TITLE js=$GOT_JS"
            if echo "$TITLE" | grep -qi 'peerdrive' && [ "$GOT_JS" = "$WANT_JS" ]; then
              echo "线上已是本次完整 UI（JS 指纹一致）"
              fresh=1
              break
            fi
            sleep 30
          done
          if [ "$fresh" != 1 ]; then
            echo "::warning::等了 5 分钟线上仍不是本次产物（或 title/指纹不符）"
          fi
