name: Go Build Matrix
on: [push, pull_request]

jobs:
  build:
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest,  goos: linux,   goarch: amd64 }
          - { os: ubuntu-latest,  goos: linux,   goarch: arm64 }
          - { os: windows-latest, goos: windows, goarch: amd64 }
          - { os: macos-latest,   goos: darwin,  goarch: amd64 }
          - { os: macos-latest,   goos: darwin,  goarch: arm64 }

    runs-on: ${{ matrix.os }}

    defaults:
      run:
        working-directory: go/

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Build
        run: go build -ldflags="-s -w" -o peerdrive-server${{ matrix.goos == 'windows' && '.exe' || '' }} ./cmd/server/

      - name: Test
        run: go test ./...

      - uses: actions/upload-artifact@v4
        with:
          name: peerdrive-${{ matrix.goos }}-${{ matrix.goarch }}
          path: go/peerdrive-server*
