name: Go Build Matrix
on:
  push:
    paths-ignore:
      - '**.md'
      - 'doc/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'doc/**'

jobs:
  build:
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest,  goos: linux,   goarch: amd64 }
          - { os: ubuntu-latest,  goos: linux,   goarch: arm64 }
          - { os: windows-latest, goos: windows, goarch: amd64 }
          - { os: macos-latest,   goos: darwin,  goarch: amd64 }
          - { os: macos-latest,   goos: darwin,  goarch: arm64 }

    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: back
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: back/go.sum

      # GOOS/GOARCH 必须走 env，不能写成 `GOOS=... go build`：windows-latest
      # 的默认 shell 是 pwsh，前置赋值的 bash 语法会被当成命令名。
      #
      # CGO_ENABLED=0 的原因与 release.yml 一致：Windows runner 上没有 C 编译器，
      # cgo 版 SQLite（mattn/go-sqlite3）编不过；关掉后走纯 Go 驱动
      # （modernc.org/sqlite，见 back/internal/repository/db_driver_pure.go）。
      # 副作用是好的：发布包同样是按 CGO_ENABLED=0 构建的，这条 CI 正好覆盖
      # 发布出去的二进制实际用的那条驱动路径。
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        # 单二进制（v0.3.0）：主服务 / 信令 / 注册认证是它的子命令。
        run: go build -tags nosqlite -buildvcs=false -ldflags="-s -w" -o peerdrive${{ matrix.goos == 'windows' && '.exe' || '' }} ./cmd/peerdrive/

      # 平台入口（2026-10-24 起）：Windows 桌面入口带系统托盘
      # （./cmd/peerdrive-win/），只在 Windows 上编得出意义（internal/tray 是
      # //go:build windows），所以挂在 windows 矩阵格下，不新增矩阵维度。
      # 托盘入口随格子的 GOARCH 编。Win7 入口（./cmd/peerdrive-win7/，同为
      # 托盘版）不在这里编——它必须用 XTLS/go-win7 补丁 SDK（官方 Go 在 Win7
      # 启动即崩），由下方独立的 build-win7 job 负责。
      - name: Build tray entry (windows only)
        if: matrix.goos == 'windows'
        env:
          GOOS: windows
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: go build -tags nosqlite -buildvcs=false -ldflags="-s -w" -o peerdrive-win.exe ./cmd/peerdrive-win/

      # Windows 也跑测试，不再跳过（2026-09-20）。
      #
      # 之前 `if: matrix.goos != 'windows'` 的代价：路径边界这套判定里最有
      # Windows 味的语义（盘符大小写折叠、`\\?\` 前缀、盘符相对写法 `D:`）
      # 全部只在 Linux 上跑过，Windows 那一支在 CI 里等于从未执行。跳过只是把
      # "没测过"包装成"绿"，不是真的没风险——真机 Windows 第一次跑就抓出
      # 三个只在 Windows 上成立的 bug（详见 doc/NETDISK.md §11.3）。
      # 保留 30 分钟超时：Windows runner 上的 go test 首次编译明显更慢。
      - name: Test
        timeout-minutes: 30
        env:
          CGO_ENABLED: 0
        run: go test -tags nosqlite ./...

      - uses: actions/upload-artifact@v4
        with:
          name: peerdrive-${{ matrix.goos }}-${{ matrix.goarch }}
          path: back/peerdrive*

  # Win7 兼容构建（2026-10-25，XTLS/go-win7 补丁 SDK）：
  # 官方 Go 1.21.5+ 运行时启动阶段调用 bcryptprimitives.dll!ProcessPrng，
  # Win7 没有该 DLL，进程以 Exception 0xc0000005 崩在起跑线上。用补丁 SDK
  # 出兼容 Win7~11 的 386/amd64 托盘版二进制；go.mod 与依赖树不动。
  # 单独 job 而不是塞进 windows 矩阵格：补丁 SDK 与 runner 的 GOOS 无关
  # （纯交叉编译），且不该让整条矩阵的 Windows 构建都拖一次 SDK 下载。
  # 脚本与本地一致（scripts/build-win7.sh），CI 不复制构建逻辑。
  build-win7:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4

      - name: Build Win7-compatible binaries (patched SDK)
        run: bash scripts/build-win7.sh

      - uses: actions/upload-artifact@v4
        with:
          name: peerdrive-win7-patched
          path: back/dist/peerdrive-win7-*.exe

  # BT 运行时以 c-shared 形式单独构建（back/p2p_bt/cmd/btbridge → peerdrive_bt.dll）。
  # 主矩阵与 submodules 都用 CGO_ENABLED=0，覆盖不到这条路径：导出符号被改名、
  # cgo 导出被删、产物重新变成动态链接 mingw 运行时，只有真编一次才会红。
  bt-dll:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: back/p2p_bt/go.sum

      # go-libutp 是 C++：缺 g++ 前端时 cgo 会回落到宿主 g++，报
      # "unrecognized command-line option '-mthreads'"（与本仓库代码无关）。
      - name: Install mingw-w64 (C and C++)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64

      - name: Build peerdrive_bt.dll
        working-directory: back/p2p_bt
        env:
          CGO_ENABLED: 1
          GOOS: windows
          GOARCH: amd64
          CC: x86_64-w64-mingw32-gcc
          CXX: x86_64-w64-mingw32-g++
          CGO_LDFLAGS: -static -static-libgcc -static-libstdc++
        run: go build -buildmode=c-shared -trimpath -buildvcs=false -ldflags="-s -w" -o ../../dist/peerdrive_bt.dll ./cmd/btbridge

      - name: Verify exports and static runtime
        run: |
          set -e
          for sym in pd_bt_open pd_bt_call pd_bt_close pd_bt_free pd_bt_last_error pd_bt_version; do
            if ! x86_64-w64-mingw32-objdump -p dist/peerdrive_bt.dll | grep -q "$sym"; then
              echo "::error::peerdrive_bt.dll is missing export $sym"
              exit 1
            fi
          done
          # 动态依赖只能是系统 DLL。一旦 CGO_LDFLAGS 掉了 -static，产物会需要
          # libwinpthread-1.dll / libgcc_s_seh-1.dll / libstdc++-6.dll，宿主
          # LoadLibrary 只会报 "The specified module could not be found"。
          if x86_64-w64-mingw32-objdump -p dist/peerdrive_bt.dll | grep -E "libwinpthread|libgcc_s|libstdc[+][+]"; then
            echo "::error::peerdrive_bt.dll depends on mingw runtime DLLs; add -static to CGO_LDFLAGS"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: peerdrive-bt-dll
          path: dist/peerdrive_bt.dll

  # 独立 go.mod 的子模块（doc/testing 的盲区清单里有它们）：
  # signalserver（信令，含 wss 与 CORS 用例）与 p2p_bt（BT/DHT）。
  # 主 CI 只跑 back 主模块，这两个**改坏了 Peerdrive CI 照样绿**；
  # 发版门禁的 gate 会跑 signalserver（半覆盖），p2p_bt 则完全没有 job。
  # 这里一格把两个都跑掉：它们是纯 Go 逻辑，不占平台矩阵。
  submodules:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: |
            back/signalserver/go.sum
            back/p2p_bt/go.sum

      # go vet 单独一步：`go test` 不产出二进制、也不走 vet 分析，
      # 独立 module 的静态检查只有在这一步里跑。与主模块 backend job 的
      # vet/test/build 三步对齐，避免 signalserver 只测不 vet。
      - name: Vet signalframe
        working-directory: back/signalframe
        env:
          CGO_ENABLED: 0
        run: go vet ./...

      - name: Test signalframe
        working-directory: back/signalframe
        env:
          CGO_ENABLED: 0
        run: go test -count=1 ./...

      - name: Vet signalserver
        working-directory: back/signalserver
        env:
          CGO_ENABLED: 0
        run: go vet ./...

      - name: Test signalserver
        working-directory: back/signalserver
        env:
          CGO_ENABLED: 0
        run: go test -count=1 ./...

      # go test 会编译包，但不会产出二进制。back/signalserver 是独立 module，
      # 父模块的 ./... 覆盖不到它，只测不建会漏掉那边的链接错误
      # （cmd/peersignal 入口已并入父模块的 `peerdrive signal` 子命令，
      #  但 signalserver 库本身仍是独立 module，仍需单独验证能编）。
      - name: Build signalserver module
        working-directory: back/signalserver
        env:
          CGO_ENABLED: 0
        run: go build -o /dev/null ./...

      # 父模块的集成测试带 //go:build integration，日常 job 不覆盖；
      # 它是唯一会编译 back/go.mod 里 require/replace 与 ./signalserver
      # 是否匹配的地方（2026-10-04 那条坏 replace 就藏在这里）。
      #
      # -timeout 240s：这套用例跑真实 WS/信令链路，挂死时靠 Go 默认 10 分钟
      # 兜底，等于每次红都白烧十分钟 runner（2026-10-31 实测
      # TestFrameVerbs_UploadAndSync 卡满 600s）。正常路径全套约 1~2 分钟，
      # 4 分钟仍留足慢 runner 的余量，且挂死照样打印完整 goroutine 栈。
      - name: Vet integration tests
        working-directory: back
        env:
          CGO_ENABLED: 0
        run: go vet -tags integration ./test/integration/

      - name: Test integration (signalserver wiring)
        working-directory: back
        env:
          CGO_ENABLED: 0
        run: go test -tags 'integration nosqlite' -count=1 -timeout 240s ./test/integration/

      - name: Test p2p_bt
        working-directory: back/p2p_bt
        env:
          CGO_ENABLED: 0
        run: go test -count=1 ./...

      - name: Vet p2p_bt
        working-directory: back/p2p_bt
        env:
          CGO_ENABLED: 0
        run: go vet ./...

      # p2p_bt 与 signalserver 一样是独立 module，父模块的 ./... 覆盖不到它。
      # 只 go test 会漏掉 main 包链接路径上的 import 错误。
      - name: Build p2p_bt
        working-directory: back/p2p_bt
        env:
          CGO_ENABLED: 0
        run: go build -o /dev/null ./...

      # 依赖漏洞扫描（Issue #142）：覆盖 utls / x/crypto / quic-go 与三个独立子模块。
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck on main backend and submodules
        working-directory: back
        continue-on-error: true
        run: |
          govulncheck -tags nosqlite ./...
          (cd signalframe && govulncheck ./...)
          (cd peerjs && govulncheck ./...)
          (cd signalserver && govulncheck ./...)
          (cd p2p_bt && govulncheck ./...)
