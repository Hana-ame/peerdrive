name: Go Build Matrix
on: [push, pull_request]

jobs:
  build:
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest,  goos: linux,   goarch: amd64 }
          - { os: ubuntu-latest,  goos: linux,   goarch: arm64 }
          - { os: windows-latest, goos: windows, goarch: amd64 }
          - { os: macos-latest,   goos: darwin,  goarch: amd64 }
          - { os: macos-latest,   goos: darwin,  goarch: arm64 }

    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: back
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: back/go.sum

      - name: Build
        run: go build -tags nosqlite -ldflags="-s -w" -o peerdrive-server${{ matrix.goos == 'windows' && '.exe' || '' }} ./cmd/server/

      - name: Test
        if: matrix.goos != 'windows'
        run: go test -tags nosqlite ./...

      - uses: actions/upload-artifact@v4
        with:
          name: peerdrive-${{ matrix.goos }}-${{ matrix.goarch }}
          path: back/peerdrive-server*
