name: Release
on:
  push:
    tags: ['v*']
  # 手动跑一次门禁而不发版：改完 workflow 想验证「门禁会不会过」时用，
  # dry_run 默认 true，所以 workflow_dispatch 时 release 那步会被跳过。
  workflow_dispatch:
    inputs:
      dry_run:
        description: '只跑门禁，不出包、不发 release'
        type: boolean
        default: true

jobs:
  # 发版门禁：打 tag 时先把核心测试跑一遍，红了就不出包、不发 release。
  # 为什么 release 里要再跑一遍，而不是等 ci.yml：workflow 之间没有 needs，
  # ci.yml 虽然也在 tags 上触发，但它和 release 是并行的、拦不住这里——
  # 想要「测试没过就不发版」，门禁必须长在 release 自己身上。
  # 范围取「核心且快」：后端（vet+测试+构建）、信令模块、peerjs 模块、
  # 消费端包（含面板产物漂移）、脱外网的集成测试（唯一覆盖真实握手的用例）。
  # media/frontend 的 npm 套件由 ci.yml 在 tags 上并行覆盖，不在这里重复。
  gate:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: back/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 后端 vet + 测试 + 构建
        working-directory: back
        run: |
          go vet -tags nosqlite ./...
          go test -tags nosqlite ./... -count=1
          go build -tags nosqlite -o peerdrive-server ./cmd/server/

      # 集成测试：TestMain 起全局自托管信令 + 同机 WebRTC，脱外网。
      # 必须 -p 1（多组测试共享同一个信令服务，并行会互相干扰）。
      - name: 集成测试
        working-directory: back
        run: go test -tags "nosqlite integration" ./test/integration/ -count=1 -p 1 -timeout 10m

      # 下面两个是独立 go.mod（主仓 replace 指向本地），back 的 ./... 覆盖不到。
      - name: 自托管信令模块
        working-directory: back/signalserver
        run: go test ./... -count=1

      - name: peerjs 模块
        working-directory: back/peerjs
        run: go test ./... -count=1

      - name: 消费端包 + 面板产物一致性
        working-directory: packages/peerdrive-client
        run: |
          npm test
          npm run check:panel

  build:
    needs: gate
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest,  goos: linux,   goarch: amd64, ext: '' }
          - { os: ubuntu-latest,  goos: linux,   goarch: arm64, ext: '' }
          - { os: windows-latest, goos: windows, goarch: amd64, ext: '.exe' }
          - { os: macos-latest,   goos: darwin,  goarch: amd64, ext: '' }
          - { os: macos-latest,   goos: darwin,  goarch: arm64, ext: '' }

    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: back
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: back/go.sum

      - name: Build
        # GOOS/GOARCH 必须走 env，不能写成 `GOOS=... go build`：windows-latest
        # 的默认 shell 是 pwsh，前置赋值的 bash 语法会被当成命令名
        # （2026-09-20 用 workflow_dispatch 试跑时暴露：windows 那格一直红）。
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: go build -ldflags="-s -w" -o peerdrive-server${{ matrix.ext }} ./cmd/server/

      # 发布资产是按 basename 上传的：五个平台都叫 peerdrive-server（windows 多个
      # .exe）会互相覆盖，release 里只剩一个、还看不出是哪个平台的。所以在上传前
      # 就把平台名编进文件名。显式 shell: bash —— windows-latest 默认是 pwsh，
      # `cp`/`mkdir -p` 在那里不是同一套语义。
      - name: 按平台重命名
        shell: bash
        run: |
          set -eu
          mkdir -p out
          cp "peerdrive-server${{ matrix.ext }}" "out/peerdrive-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}"

      - uses: actions/upload-artifact@v4
        with:
          name: peerdrive-${{ matrix.goos }}-${{ matrix.goarch }}
          path: back/out/peerdrive-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}

  # 自托管信令同样要「下载即用」：教程第一章起本地信令不该先要求装 Go。
  # 它是独立 go.mod（back/signalserver），所以单独一个 job 编，不能并进上面那个
  # （上面 defaults.working-directory 是 back，./cmd/peersignal 不在主模块里）。
  build-signalserver:
    needs: gate
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest,  goos: linux,   goarch: amd64, ext: '' }
          - { os: ubuntu-latest,  goos: linux,   goarch: arm64, ext: '' }
          - { os: windows-latest, goos: windows, goarch: amd64, ext: '.exe' }
          - { os: macos-latest,   goos: darwin,  goarch: amd64, ext: '' }
          - { os: macos-latest,   goos: darwin,  goarch: arm64, ext: '' }

    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: back/signalserver
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: back/signalserver/go.sum

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: go build -ldflags="-s -w" -o peersignal${{ matrix.ext }} ./cmd/peersignal/

      - name: 按平台重命名
        shell: bash
        run: |
          set -eu
          mkdir -p out
          cp "peersignal${{ matrix.ext }}" "out/peersignal-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}"

      - uses: actions/upload-artifact@v4
        with:
          name: peersignal-${{ matrix.goos }}-${{ matrix.goarch }}
          path: back/signalserver/out/peersignal-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}

  release:
    needs: [build, build-signalserver]
    # tag 推送才发 release；手动 dispatch 默认 dry_run（只验证门禁跑得通）。
    if: ${{ github.event_name == 'push' || !inputs.dry_run }}
    runs-on: ubuntu-latest
    # 建 release / 传资产需要 contents: write。仓库若把 GITHUB_TOKEN 的默认权限
    # 设成只读（GitHub 2023 起新建仓库的默认），这一步会 403 而报错信息又不说
    # 是权限问题——所以显式写出来，别依赖仓库级默认值。
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/download-artifact@v4

      # 摊平后再发布：download-artifact 会把每个 artifact 放进以它名字命名的目录，
      # 目录层级取决于上传时给的 path，写死 glob 很脆。这里按文件名捞出来放进
      # dist/，既不依赖布局，日志里也能一眼看到最终会挂上去哪些资产。
      - name: 摊平发布资产
        run: |
          set -eu
          mkdir -p dist
          find . -type f \( -name 'peerdrive-*' -o -name 'peersignal-*' \) -exec cp -v {} dist/ \;
          ls -l dist

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
