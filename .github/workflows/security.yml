name: Peerdrive Security (Red-Team)

on:
  push:
    branches:
      - main
      - master
      - refactor
      - base
      - docs
      - "feat/*"
      - "fix/*"
      - "module/*"
      - "*-agent"
      - "*-frontend"
    tags: ['v*']
  pull_request:
    branches: [main, master, refactor]
  schedule:
    # 每周跑一次全量扫描（含 npm audit），即使没有提交也能发现新披露的依赖漏洞。
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ── 红队回归测试 ─────────────────────────────────────────────────────
  # 2026-10-11 UI 对抗审计（audit R3）发现的漏洞都在这里固化成用例，防止回归：
  #   1. HIGH 存储型 XSS：上传 .html/.js 后经 /sha256sum/:hash?inline=1 以
  #      text/html / text/javascript 渲染 → 同源 CSP `default-src 'self'` 允许
  #      <script src>，载荷可执行并读到 localStorage 的 peerdrive_auth_token。
  #   2. MEDIUM 分享链接 302 Location 注入：/shares 未校验 hash。
  #   3. MEDIUM follow-redirects URL provider 未约束 scheme。
  #
  # 为什么不合并进 ci.yml 的 backend job：安全回归用例会主动构造恶意输入，
  # 与功能测试混在一起，失败时容易看不出「是功能坏了还是防护漏了」。
  # 独立 job 失败时一眼定位；也允许单独手动触发做审计复核。
  redteam-regression:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: back
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: back/go.sum
      - run: go mod download
      - name: 红队安全回归用例 R1 (XSS / Location 注入 / Content-Disposition)
        # 2026-10-13 加「套件空转防护」：若 0 个用例运行（测试被删/改名/过滤器
        # 漏配）则硬 fail——安全回归门禁绝不允许静默空转。PASS 数打印可见。
        run: |
          go test -tags nosqlite ./internal/controller/ \
            -run 'TestDownload_|TestShare_|TestSafeFilename|TestIsHTTPURL' \
            -count=1 -v > /tmp/rt-r1.log 2>&1 || { tail -30 /tmp/rt-r1.log; exit 1; }
          n=$(grep -cE '^--- PASS' /tmp/rt-r1.log || true)
          echo "R1 红队回归 PASS 数: $n（预期 ≥9：Download×5 + Share×2 + SafeFilename + IsHTTPURL）"
          if [ "$n" -eq 0 ]; then
            echo "::error::红队回归 R1 0 个用例运行——套件可能被删/改名，禁止空转"
            exit 1
          fi

      # R2（第二轮，全栈）：JSON 请求体上限 / CORS 头白名单 / Origin 通配符
      # scheme 校验 / 安全头契约（TestSecurityHeaders，2026-10-13 补进隔离门禁）/
      # 弱 AdminToken 与启动姿态（TestSecurityStatus / TestValidateAuthStartup_，
      # 2026-10-13 补进隔离门禁）。这些用例是「修完再被绕过」的防线，
      # 单独命名一步，免得将来有人改 controller 时把它们当 controller 用例删掉。
      - name: 红队安全回归用例 R2 (JSON 上限 / CORS / Origin / 安全头 / 启动姿态 / 弱令牌)
        # 过滤器扩展后（2026-10-13）：router 12 例（JSON 上限 4 + CORS 2 +
        # Origin 2 + 安全头 4——含 2026-10-13 HSTS 代码轮新增 TestSecurityHeaders_HSTS）、
        # serverapp 13 例（启动姿态 7 + 状态 5 + 弱密钥 1）。
        # 同样带空转防护（0 用例运行即 fail）。
        run: |
          go test -tags nosqlite ./internal/router/ \
            -run 'TestLimitJSONBody|TestCORS_|TestIsOriginAllowed|TestSecurityHeaders' \
            -count=1 -v > /tmp/rt-r2a.log 2>&1 || { tail -30 /tmp/rt-r2a.log; exit 1; }
          na=$(grep -cE '^--- PASS' /tmp/rt-r2a.log || true)
          echo "R2 router PASS 数: $na（预期 12）"
          go test -tags nosqlite ./internal/serverapp/ \
            -run 'TestSecurityStatus|TestValidateAuthStartup_|TestIsWeakSecret' \
            -count=1 -v > /tmp/rt-r2b.log 2>&1 || { tail -30 /tmp/rt-r2b.log; exit 1; }
          nb=$(grep -cE '^--- PASS' /tmp/rt-r2b.log || true)
          echo "R2 serverapp PASS 数: $nb（预期 13）"
          if [ "$na" -eq 0 ] || [ "$nb" -eq 0 ]; then
            echo "::error::红队回归 R2 0 个用例运行——套件可能被删/改名，禁止空转"
            exit 1
          fi

  # ── Go 静态安全扫描 ───────────────────────────────────────────────────
  # gosec 覆盖 CWE 级别的问题（命令注入、弱哈希、TLS 校验关闭、路径拼接等）。
  # severity=medium 起报：low 噪音太大（大量误报在第三方回退路径上），
  # medium 起是「真实可被利用」的门槛。当前是报告模式（不阻断主干）——
  # 扫描结果随 artifact 归档，安全项逐条 triage 后再把门槛收紧成 fail。
  gosec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: back/go.sum
      # go.mod 不在仓库根（在 back/ 与两个子模块里），下载必须进各自目录。
      - name: 下载依赖 (back + 两个子模块)
        run: |
          go mod download -C back
          go mod download -C back/signalserver
          go mod download -C back/p2p_bt
      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@latest
      - name: 扫描主模块 back/ (tags=nosqlite)
        working-directory: back
        run: gosec -tags nosqlite -severity medium -confidence medium -fmt json -out gosec-back.json ./... || echo "::warning::gosec reported findings (see artifact)"
      # 子模块是独立 go.mod：主模块的 nosqlite tag 不适用，且按 AGENTS.md
      # 它们在 CI 里走 CGO_ENABLED=0（纯 Go 驱动）。
      - name: 扫描子模块 signalserver
        working-directory: back/signalserver
        env:
          CGO_ENABLED: "0"
        run: gosec -severity medium -confidence medium -fmt json -out gosec-signal.json ./... || echo "::warning::gosec reported findings (see artifact)"
      - name: 扫描子模块 p2p_bt
        working-directory: back/p2p_bt
        env:
          CGO_ENABLED: "0"
        run: gosec -severity medium -confidence medium -fmt json -out gosec-p2pbt.json ./... || echo "::warning::gosec reported findings (see artifact)"
      - name: 汇总报告
        if: always()
        run: |
          python3 - <<'PY'
          import glob, json
          # gosec -fmt json 输出的是 {"Issues": [...], "Stats": ...}，不是裸数组；
          # 两种形态都兼容，老版本 gosec 出的是数组。
          total = 0
          files = sorted(glob.glob("back/gosec-*.json") + glob.glob("back/*/gosec-*.json"))
          for p in files:
              try:
                  data = json.load(open(p))
              except Exception as e:
                  print(f"{p}: unreadable ({e})"); continue
              issues = data.get("Issues", []) if isinstance(data, dict) else data
              if not isinstance(issues, list):
                  print(f"{p}: unexpected shape {type(data).__name__}"); continue
              total += len(issues)
              print(f"{p}: {len(issues)} finding(s)")
              for f in issues[:12]:
                  loc = f"{f.get('file')}:{f.get('line')}"
                  print(f"  - [{f.get('severity')}/{f.get('confidence')}] "
                        f"{f.get('rule_id')} {str(f.get('details'))[:100]} @ {loc}")
          print(f"TOTAL: {total} finding(s) — 报告模式，不阻断；逐条 triage 后收紧成硬门禁")
          PY
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gosec-reports
          path: back/**/gosec-*.json
          if-no-files-found: ignore

  # ── 前端依赖漏洞 ──────────────────────────────────────────────────────
  # npm audit 只检查 package-lock 里已声明的依赖。audit-level=high 避免
  # low/moderate 级别的历史噪音阻断主干；critical/high 才需要处理。
  #
  # 两个刻意的取舍：
  #   1. 矩阵只列**有 lockfile** 的包。packages/peerdrive-client 是零运行时依赖
  #      的纯 ESM 源码，没有 package-lock.json——列进去会让 setup-node 的
  #      cache-dependency-path 解析失败，整个 job 在拉依赖前就红。
  #   2. 分级门禁（2026-10-13 生效，依据本地实测读数）：
  #      - 运行时依赖（--omit=dev，high+）→ **硬门禁**：front / packages
  #        peerdrive-media 的 prod audit 均为 0 漏洞，任何 prod high+ 直接红灯。
  #      - devDependencies（high+）→ 仍报告模式：front 5 high（braces 链）、
  #        media 9（3 moderate / 2 high / 4 critical）全部是构建/测试期 dev
  #        依赖，运行时不可达（--omit=dev 的 prod 门禁已覆盖运行面）；
  #        dev 依赖升级列为独立一轮，triage 清零后再把该步转硬门禁。
  npm-audit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir: [front, packages/peerdrive-media]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ${{ matrix.dir }}/package-lock.json
      - name: 审计运行时依赖漏洞 (high+, 硬门禁)
        run: |
          cd ${{ matrix.dir }}
          test -f package-lock.json || { echo "no lockfile — skip"; exit 0; }
          npm ci --ignore-scripts --audit=false --no-fund
          npm audit --audit-level=high --omit=dev
      - name: 审计 devDependencies 漏洞 (high+, 报告模式)
        run: |
          cd ${{ matrix.dir }}
          test -f package-lock.json || exit 0
          npm audit --audit-level=high
        continue-on-error: true

  # ── 依赖漏洞扫描（OSV-Scanner）────────────────────────────────────────
  # 把仓库内全部 lockfile（back / peerjs / signalserver / p2p_bt 四个独立
  # go.mod + front / peerdrive-media 两个 package-lock.json）对着 OSV 数据库
  # （osv.dev：Go vuln DB + GitHub Advisory）做依赖版本漏洞匹配。
  # 与 gosec 的分工：gosec 是 Go 静态分析（CWE 级）；OSV 是「锁定的依赖版本
  # 是否落在已知漏洞区间」（GO-/GHSA- 级）。与 npm-audit 的分工：npm-audit
  # 只看 npm 锁文件；OSV 补上 Go 模块这条完全没覆盖的面。
  #
  # 首扫读数（2026-10-13，refactor @ 8669913）：97 组发现，其中 12 组
  # call-graph 确认可达；依赖升级轮（PR #356 → aa87f97）后**可达清零**
  # （45 组全不可达）。本轮起门禁语义：
  #   - 扫描步骤容忍「不可达噪音」：osv-scanner 的 exit 1 = 任意发现
  #     （含不可达），直接 fail 会误杀 45 组噪音 → continue-on-error 保留，
  #     发现仍随 artifact 归档、摘要打印到日志；
  #   - 「汇总报告」步骤做**可达级硬门禁**：call-graph 可达（called=True）> 0
  #     时 ::error:: + exit 1（红灯），= 0 时通过。
  #   - **直接依赖可修复漏洞硬门禁**（2026-10-13 由 paho.mqtt GO-2025-4173 引入）：
  #     各 go.mod 直接依赖（非 indirect）且有 fixed 版本的发现 → 硬 fail。
  #     直接依赖升级低风险、不该留噪音；无修复版（x/crypto GO-2026-5932）豁免。
  #   判据取 called=True：只拦「真会被执行到」的漏洞；不可达发现（dev 依赖、
  #   无调用链的传递库）不阻断 PR，避免误杀。osv-scanner 的 called 分析详见
  #   https://google.github.io/osv-scanner（experimental call analysis）。
  osv-dependency-scan:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
      - name: Install OSV-Scanner (pinned v2.7.0)
        # 直接取官方预编译二进制（免 go install 构建时间）。升级：改 URL 里的
        # 版本号，行为以 https://google.github.io/osv-scanner 文档为准。
        run: |
          curl -sL --max-time 120 \
            "https://github.com/google/osv-scanner/releases/download/v2.7.0/osv-scanner_linux_amd64" \
            -o osv-scanner
          chmod +x osv-scanner
          ./osv-scanner --version
      - name: 扫描全部依赖 lockfile（Go 模块 + npm）
        # osv-scanner 有任意发现（含不可达）就 exit 1；这里容忍噪音，
        # 硬门禁在下方「汇总报告」步骤按 call-graph 可达（called=True）判定。
        continue-on-error: true
        run: |
          ./osv-scanner scan source -r . --format json --output-file osv-results.json \
            || echo "::warning::OSV-Scanner 报告了依赖漏洞，见下方摘要与 artifact"
      - name: 汇总报告 + 可达漏洞硬门禁
        if: always()
        run: |
          python3 - <<'PY'
          import json

          def short(p):
              for tok in ('back/', 'front/', 'packages/'):
                  i = p.find('/' + tok)
                  if i >= 0:
                      return p[i + 1:]
                  if p.startswith(tok):
                      return p
              return '/'.join(p.split('/')[-2:])

          try:
              data = json.load(open('osv-results.json'))
          except Exception as e:
              print(f"osv-results.json 解析失败: {e}")
              raise SystemExit(1)

          total = 0
          by_src = {}
          called = []
          for r in data.get('results', []):
              src = short(r.get('source', {}).get('path', '?'))
              for p in r.get('packages', []) or []:
                  pkg = p.get('package', {}).get('name', '?')
                  ver = p.get('package', {}).get('version', '?')
                  for g in p.get('groups', []) or []:
                      ids = g.get('ids', []) or []
                      vid = ids[0] if ids else '?'
                      sev = g.get('max_severity', '?')
                      ea = g.get('experimental_analysis') or {}
                      is_called = any(v.get('called') for v in ea.values())
                      fixed = None
                      for v in p.get('vulnerabilities', []) or []:
                          for a in v.get('affected', []) or []:
                              for rng in a.get('ranges', []) or []:
                                  for ev in rng.get('events', []) or []:
                                      if 'fixed' in ev:
                                          fixed = ev['fixed']
                      total += 1
                      by_src[src] = by_src.get(src, 0) + 1
                      mark = ' ★call-graph 可达' if is_called else ''
                      print(f"  [{sev}] {vid} {pkg}@{ver} -> {fixed or '无修复'} ({src}){mark}")
                      if is_called:
                          called.append((sev, vid, pkg, ver, fixed))
          print(f"TOTAL: {total} 组依赖漏洞发现（OSV 数据库）")
          print(f"call-graph 确认可达: {len(called)} 组")
          for src, n in sorted(by_src.items(), key=lambda x: -x[1]):
              print(f"  {src}: {n}")
          if called:
              print("★ 可达项（优先级最高，先 triage 这些）:")
              for sev, vid, pkg, ver, fixed in called:
                  print(f"  [{sev}] {vid} {pkg}@{ver} -> {fixed or '无修复'}")
              # ── 硬门禁：call-graph 可达漏洞直接红灯 ──
              print(f"::error::OSV-Scanner 发现 {len(called)} 组 call-graph 可达漏洞，"
                    "硬门禁拦截——请升级对应依赖后重跑")
              raise SystemExit(1)
          print("可达漏洞硬门禁：0 组，通过 ✓")

          # ── 硬门禁②：直接依赖且有可用修复版本的漏洞 ──
          # 2026-10-13 由 paho.mqtt GO-2025-4173（back 直接依赖，6.3，修复版 1.5.1）
          # 引入：直接依赖即使 call-graph 不可达（当前判据），一旦将来被新用法
          # 触达就是编码边界 bug；且直接依赖升级是低风险动作，不该留噪音。
          # 谓词 = 各 go.mod require 块内的非 indirect 包 × 有 fixed 版本的发现；
          # 无修复版（如 x/crypto GO-2026-5932）天然豁免。修复 paho 后现 0 项。
          import re as _re
          def _direct_deps(gomod):
              s = set()
              try:
                  txt = open(gomod).read()
              except OSError:
                  return s
              for m in _re.finditer(r'require \(([^)]*)\)', txt, _re.S):
                  for ln in m.group(1).splitlines():
                      ln = ln.strip()
                      if ln and not ln.startswith('//') and '// indirect' not in ln and '=>' not in ln:
                          s.add(ln.split()[0])
              return s
          _direct = {}
          for _gm in ['back/go.mod', 'back/p2p_bt/go.mod', 'back/peerjs/go.mod',
                      'back/signalframe/go.mod', 'back/signalserver/go.mod']:
              _direct[_gm] = _direct_deps(_gm)
          fixable_direct = []
          for r in data.get('results', []):
              src = r.get('source', {}).get('path', '')
              gm = next((gm for gm in _direct if gm in src), None)
              if not gm:
                  continue
              for p in r.get('packages', []) or []:
                  pkg = p.get('package', {}).get('name')
                  if pkg not in _direct[gm]:
                      continue
                  for g in p.get('groups', []) or []:
                      ids = g.get('ids', ['?'])[0]
                      fx = None
                      for v in p.get('vulnerabilities', []) or []:
                          for a in v.get('affected', []) or []:
                              for rng in a.get('ranges', []) or []:
                                  for ev in rng.get('events', []) or []:
                                      if 'fixed' in ev:
                                          fx = ev['fixed']
                      if fx:
                          fixable_direct.append((ids, pkg, fx, gm))
          if fixable_direct:
              for ids, pkg, fx, gm in fixable_direct:
                  print(f"::error::直接依赖 {pkg} 有可修复漏洞 {ids}"
                        f"（修复版 {fx}，{gm}）——硬门禁拦截，请升级后重跑")
              raise SystemExit(1)
          print("直接依赖可修复漏洞硬门禁：0 组，通过 ✓")
          PY
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: osv-scanner-reports
          path: osv-results.json
          if-no-files-found: ignore

  # ── 依赖许可证合规（OSV-Scanner 内置 --licenses，复用同一 pin 二进制）───
  # 2026-10-13 首扫（refactor @ 446e8ca）基线：MIT 414 / BSD-3 82 / Apache-2.0 51 /
  # MPL-2.0 42 / ISC 20 / BSD-2 14 / CC-BY-4.0 1 / EPL-2.0 1 / MIT OR X11 1 /
  # UNKNOWN 6；**无 GPL/AGPL/SSPL 强 copyleft**。
  # UNKNOWN 明细（基线，均待补齐 license 字段或核实）：
  #   go-llsqlite/adapter、multiformats/go-base36（Go）、electron-to-chromium、
  #   options（npm）、**peerdrive-client（本仓自己的包，未声明 license 字段，可直接修）**。
  # 报告模式（不阻断主干）：打印分布 + 违规清单，UNKNOWN/GPL 类出现时 ::warning::。
  # 硬门禁（--licenses="允许列表"）属业务许可证策略，团队定案后收紧。
  license-scan:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
      - name: Install OSV-Scanner (pinned v2.7.0)
        run: |
          curl -sL --max-time 120 \
            "https://github.com/google/osv-scanner/releases/download/v2.7.0/osv-scanner_linux_amd64" \
            -o osv-scanner
          chmod +x osv-scanner
      - name: 扫描许可证分布 + 违规清单（报告模式）
        # allowlist=当前观测到的许可证集合（基线）：
        # 分布外的项即为 UNKNOWN 或新引入的许可证，逐条 triage。
        run: |
          ./osv-scanner --licenses="MIT,BSD-3-Clause,Apache-2.0,MPL-2.0,ISC,BSD-2-Clause,CC-BY-4.0,EPL-2.0" \
            ./back ./back/p2p_bt ./back/peerjs ./back/signalserver \
            ./front ./packages/peerdrive-media > /tmp/license.txt 2>&1 || true
          python3 - <<'PY'
          import re
          txt = open('/tmp/license.txt').read()
          dist = re.findall(r'^\| (\S[^|]*?) *\| *(\d+) *\|$', txt, re.M)
          print('== 许可证分布 ==')
          for name, n in dist:
              print(f'  {name.strip():16s} {n}')
          viol = []
          seen = set()
          in_viol = False
          for ln in txt.splitlines():
              if 'LICENSE VIOLATION' in ln:
                  in_viol = True
                  continue
              if in_viol and ln.startswith('|'):
                  parts = [p.strip() for p in ln.strip('|').split('|')]
                  if len(parts) >= 5 and parts[0] != 'LICENSE VIOLATION':
                      key = tuple(parts[:3])
                      if key not in seen:
                          seen.add(key)
                          viol.append(key)
          print('== LICENSE VIOLATION ==')
          for lic, eco, pkg in viol:
              print(f'  [{lic}] {eco}: {pkg}')
          # MIT OR X11 是宽容双许可（非 SPDX 单 id 无法进 allowlist），不算违规
          flagged = [v for v in viol
                     if v[0].upper().split('-')[0] in ('UNKNOWN', 'GPL', 'AGPL', 'SSPL')]
          print(f'分布 {len(dist)} 类 | 违规 {len(viol)} 项 | 标记(UNKNOWN/GPL类) {len(flagged)} 项')
          if flagged:
              print('::warning::许可证检查：存在 UNKNOWN/GPL 类许可证，见上方清单'
                    '（报告模式，业务策略定案后转硬门禁）')
          PY

  # ── HTTP 安全头 E2E 门禁 ─────────────────────────────────────────────
  # R2/R3 在 middleware.go SecurityHeaders() 实现的安全头契约（nosniff /
  # X-Frame-Options / Permissions-Policy / Referrer-Policy / Cross-Origin-
  # Opener-Policy / Strict-Transport-Security / 按路径分发的 CSP），
  # redteam_r2_test.go 有单测断言；本 job 用**真实起服 + curl** 做 E2E 复核
  # （覆盖中间件挂载与真实响应链）。
  # 2026-10-13 首跑读数为 5 项契约 + 按路径分发的 CSP（含 400/404 响应）；
  # **HSTS 当时缺失**（第三轮发现）——本轮（PR #361）代码层已补
  # `max-age=31536000`（BYO 部署、故意不带 includeSubDomains，见 middleware.go
  # 注释），并**升为本契约项**：缺失/值不符 → 硬 fail。
  # 门禁语义：契约头缺失/值不符 → 硬 fail（防回归）。
  security-headers:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: back/go.sum
      - name: 构建 server (tags=nosqlite)
        working-directory: back
        run: go build -tags nosqlite -o /tmp/peerdrive-server ./cmd/server/
      - name: 起服务（最小配置）
        run: |
          mkdir -p /tmp/pd-hdr/storage
          env PORT=43111 \
            PEERDRIVE_PEERJS_ENABLE=false \
            PEERDRIVE_BT_DHT_ENABLE=false \
            PEERDRIVE_IPFS_GATEWAY_ENABLE=false \
            PEERDRIVE_ALLOW_NO_AUTH=1 \
            PEERDRIVE_STORAGE=/tmp/pd-hdr/storage \
            /tmp/peerdrive-server > /tmp/pd-hdr/server.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf -o /dev/null -m 5 http://127.0.0.1:43111/ping && break
            sleep 1
          done
          curl -sf -o /dev/null -m 5 http://127.0.0.1:43111/ping \
            || { echo "::error::server 未在 30s 内起服"; tail -20 /tmp/pd-hdr/server.log; exit 1; }
      - name: 安全头契约门禁
        run: |
          python3 - <<'PY'
          import subprocess, sys
          # 契约 = R2/R3 + HSTS（2026-10-13 代码轮补）已实现的头集合（全部路径生效，含 4xx 响应）
          contract = {
              'x-content-type-options': 'nosniff',
              'x-frame-options': 'SAMEORIGIN',
              'permissions-policy': 'camera=(), microphone=(), geolocation=(), payment=(), usb=(), fullscreen=(self)',
              'referrer-policy': 'no-referrer',
              'cross-origin-opener-policy': 'same-origin',
              'strict-transport-security': 'max-age=31536000',
          }
          paths = ['/ping', '/panel', '/swagger/index.html', '/sha256sum/nonexistent', '/']
          fails = []
          for p in paths:
              out = subprocess.run(['curl', '-s', '-D', '-', '-o', '/dev/null', '-m', '8',
                                    f'http://127.0.0.1:43111{p}'],
                                   capture_output=True, text=True).stdout
              hdrs = {}
              for ln in out.splitlines():
                  if ':' in ln and not ln.startswith(('HTTP/', '#')):
                      k, v = ln.split(':', 1)
                      hdrs[k.strip().lower()] = v.strip()
              missing = [k for k in contract if k not in hdrs]
              wrong = [f"{k}={hdrs[k]}" for k in contract if k in hdrs and hdrs[k] != contract[k]]
              csp = hdrs.get('content-security-policy')
              if missing: fails.append(f"{p}: 缺失 {missing}")
              if wrong: fails.append(f"{p}: 值不符 {wrong}")
              if not csp: fails.append(f"{p}: 缺 Content-Security-Policy")
              if 'frame-ancestors' not in (csp or ''): fails.append(f"{p}: CSP 缺 frame-ancestors")
              print(f"{p}: nosniff={hdrs.get('x-content-type-options','-')} "
                    f"XFO={hdrs.get('x-frame-options','-')} COOP={hdrs.get('cross-origin-opener-policy','-')} "
                    f"HSTS={hdrs.get('strict-transport-security','-')} "
                    f"CSP={'有' if csp else '无'} inline={'unsafe-inline' in (csp or '')}")
          if fails:
              for f in fails:
                  print(f'::error::{f}')
              raise SystemExit(1)
          print('安全头契约门禁：全部通过 ✓')
          PY
