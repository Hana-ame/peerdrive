<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1220" viewBox="0 0 1600 1220">
  <defs>
    <marker id="m_blue" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto" markerOverflow="visible"><path d="M0,1 L13,7 L0,13 Z" fill="#2563eb"/></marker>
    <marker id="m_green" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto" markerOverflow="visible"><path d="M0,1 L13,7 L0,13 Z" fill="#059669"/></marker>
    <marker id="m_purple" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto" markerOverflow="visible"><path d="M0,1 L13,7 L0,13 Z" fill="#7c3aed"/></marker>
    <marker id="m_orange" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto" markerOverflow="visible"><path d="M0,1 L13,7 L0,13 Z" fill="#ea580c"/></marker>
    <marker id="m_slate" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto" markerOverflow="visible"><path d="M0,1 L13,7 L0,13 Z" fill="#64748b"/></marker>
    <marker id="m_blue_back" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="1" refY="7" orient="auto" markerOverflow="visible"><path d="M13,1 L0,7 L13,13 Z" fill="#2563eb"/></marker>
    <marker id="m_green_back" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="1" refY="7" orient="auto" markerOverflow="visible"><path d="M13,1 L0,7 L13,13 Z" fill="#059669"/></marker>
    <marker id="m_purple_back" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="1" refY="7" orient="auto" markerOverflow="visible"><path d="M13,1 L0,7 L13,13 Z" fill="#7c3aed"/></marker>
    <marker id="m_orange_back" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="1" refY="7" orient="auto" markerOverflow="visible"><path d="M13,1 L0,7 L13,13 Z" fill="#ea580c"/></marker>
  </defs>

  <rect x="0" y="0" width="1600" height="1220" fill="#ffffff"/>

  <!-- ============ 顶部标题与说明 ============ -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans CJK SC', 'Source Han Sans SC', 'Microsoft YaHei', sans-serif">
    <text x="40" y="36" font-size="26" font-weight="700" fill="#0f172a">peerdrive 模块拓扑 · 本地存储聚合视图 (14 模块 / 13 连接)</text>
    <text x="40" y="62" font-size="13" fill="#64748b">紫色聚合区 = 本地存储与持久化核心（SQLite 元数据 + 磁盘内容寻址）　·　上方为直接交互的业务/控制面　·　右侧为 P2P 传输与信令网络面</text>
    <text x="1560" y="36" font-size="13" font-weight="700" fill="#0f172a" text-anchor="end">13 / 13 连接　·　14 / 14 模块</text>
    <text x="1560" y="62" font-size="13" fill="#64748b" text-anchor="end">依据 doc/design/connections/*.md</text>
  </g>

  <!-- ============ 本地存储聚合容器 (Local Storage Cluster) ============ -->
  <rect x="120" y="525" width="670" height="145" rx="16" fill="#faf5ff" stroke="#a855f7" stroke-width="2" stroke-dasharray="7 4"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans CJK SC', 'Source Han Sans SC', 'Microsoft YaHei', sans-serif">
    <text x="145" y="552" font-size="13.5" font-weight="700" fill="#7e22ce">📦 本地存储与持久化区 (Local Storage Core) · SQLite 元数据 + 磁盘内容寻址</text>
  </g>

  <!-- ============ 模块框（14 模块） ============ -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans CJK SC', 'Source Han Sans SC', 'Microsoft YaHei', sans-serif">
    <!-- Row 1: y=100..172 -->
    <rect x="60" y="100" width="240" height="72" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.5" stroke-dasharray="7 4"/>
    <text x="180" y="128" font-size="15" font-weight="700" fill="#92400e" text-anchor="middle">01 · config 配置</text>
    <text x="180" y="152" font-size="11" fill="#a16207" text-anchor="middle">internal/config</text>

    <rect x="520" y="100" width="260" height="72" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
    <text x="650" y="128" font-size="15" font-weight="700" fill="#1e3a8a" text-anchor="middle">13 · frontend Web 面板</text>
    <text x="650" y="152" font-size="11" fill="#1d4ed8" text-anchor="middle">front/ (React + Vite)</text>

    <!-- Row 2: y=240..312 -->
    <rect x="520" y="240" width="260" height="72" rx="10" fill="#f0fdf4" stroke="#059669" stroke-width="1.8"/>
    <text x="650" y="268" font-size="15" font-weight="700" fill="#064e3b" text-anchor="middle">04 · router 路由与中间件</text>
    <text x="650" y="292" font-size="11" fill="#047857" text-anchor="middle">internal/router</text>

    <rect x="1220" y="240" width="260" height="72" rx="10" fill="#ecfeff" stroke="#0891b2" stroke-width="1.8"/>
    <text x="1350" y="268" font-size="15" font-weight="700" fill="#155e75" text-anchor="middle">11 · signalserver 信令发现</text>
    <text x="1350" y="292" font-size="11" fill="#0e7490" text-anchor="middle">back/signalserver</text>

    <!-- Row 3: y=380..452 (读写存储的业务控制面) -->
    <rect x="150" y="380" width="260" height="72" rx="10" fill="#f0fdf4" stroke="#059669" stroke-width="1.8"/>
    <text x="280" y="408" font-size="15" font-weight="700" fill="#064e3b" text-anchor="middle">05 · controller 处理器</text>
    <text x="280" y="432" font-size="11" fill="#047857" text-anchor="middle">internal/controller (上传写盘)</text>

    <rect x="520" y="380" width="260" height="72" rx="10" fill="#f0fdf4" stroke="#059669" stroke-width="1.8"/>
    <text x="650" y="408" font-size="15" font-weight="700" fill="#064e3b" text-anchor="middle">06 · service 业务层</text>
    <text x="650" y="432" font-size="11" fill="#047857" text-anchor="middle">internal/service (元数据编排)</text>

    <rect x="1220" y="380" width="260" height="72" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="1.8"/>
    <text x="1350" y="408" font-size="15" font-weight="700" fill="#7c2d12" text-anchor="middle">09 · transport P2P 传输</text>
    <text x="1350" y="432" font-size="11" fill="#c2410c" text-anchor="middle">internal/transport (拉取落盘/供流)</text>

    <!-- Row 4 (本地存储聚合核心): y=575..647 -->
    <rect x="150" y="575" width="280" height="72" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
    <text x="290" y="603" font-size="15" font-weight="700" fill="#3b0764" text-anchor="middle">02 · repository 元数据库</text>
    <text x="290" y="627" font-size="11" fill="#6d28d9" text-anchor="middle">internal/repository · SQLite (peerdrive.db)</text>

    <rect x="480" y="575" width="280" height="72" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
    <text x="620" y="603" font-size="15" font-weight="700" fill="#3b0764" text-anchor="middle">03 · storage 内容寻址存储</text>
    <text x="620" y="627" font-size="11" fill="#6d28d9" text-anchor="middle">internal/pathutil · FileIndex (磁盘实体)</text>

    <!-- Row 4 右侧 P2P 原语 -->
    <rect x="1220" y="575" width="260" height="72" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="1.8"/>
    <text x="1350" y="603" font-size="15" font-weight="700" fill="#7c2d12" text-anchor="middle">10 · peerjs 协议库</text>
    <text x="1350" y="627" font-size="11" fill="#c2410c" text-anchor="middle">back/peerjs</text>

    <!-- Row 5: y=755..827 (多源扩展与辅助模块) -->
    <rect x="150" y="755" width="260" height="72" rx="10" fill="#f0fdf4" stroke="#059669" stroke-width="1.8"/>
    <text x="280" y="783" font-size="15" font-weight="700" fill="#064e3b" text-anchor="middle">07 · source 文件来源</text>
    <text x="280" y="807" font-size="11" fill="#047857" text-anchor="middle">internal/source · Manager</text>

    <rect x="520" y="755" width="260" height="72" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.8"/>
    <text x="650" y="783" font-size="15" font-weight="700" fill="#3b0764" text-anchor="middle">08 · downloader 多协议下载</text>
    <text x="650" y="807" font-size="11" fill="#6d28d9" text-anchor="middle">internal/downloader</text>

    <rect x="880" y="755" width="240" height="72" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.5" stroke-dasharray="7 4"/>
    <text x="1000" y="783" font-size="15" font-weight="700" fill="#92400e" text-anchor="middle">14 · nodestate 运行时状态</text>
    <text x="1000" y="807" font-size="11" fill="#a16207" text-anchor="middle">internal/nodestate</text>

    <rect x="1220" y="755" width="130" height="72" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.8"/>
    <text x="1285" y="783" font-size="13.5" font-weight="700" fill="#1e293b" text-anchor="middle">12 · media-node</text>
    <text x="1285" y="807" font-size="11" fill="#475569" text-anchor="middle">back/cmd/media-node</text>

    <rect x="1390" y="755" width="130" height="72" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.8"/>
    <text x="1455" y="783" font-size="13.5" font-weight="700" fill="#1e293b" text-anchor="middle">ech</text>
    <text x="1455" y="807" font-size="11" fill="#475569" text-anchor="middle">ECH 域名前置</text>
  </g>

  <!-- ============ 连接边（13 条） ============ -->
  <!-- 01: frontend ↔ router (垂直下行) -->
  <path d="M650,172 L650,240" fill="none" stroke="#2563eb" stroke-width="2.4" marker-start="url(#m_blue_back)" marker-end="url(#m_blue)"/>

  <!-- 12: frontend ↔ signalserver (水平折线) -->
  <path d="M780,136 L1350,136 L1350,240" fill="none" stroke="#2563eb" stroke-width="2.4" marker-start="url(#m_blue_back)" marker-end="url(#m_blue)"/>

  <!-- 02: router → controller (横折下行) -->
  <path d="M520,276 L280,276 L280,380" fill="none" stroke="#059669" stroke-width="2.4" marker-end="url(#m_green)"/>

  <!-- 05: router ↔ source (左侧独立通道直达底部，不阻挡其他模块) -->
  <path d="M520,296 L50,296 L50,791 L150,791" fill="none" stroke="#059669" stroke-width="2.4" marker-start="url(#m_green_back)" marker-end="url(#m_green)"/>

  <!-- 03: controller → service (水平直连) -->
  <path d="M410,416 L520,416" fill="none" stroke="#059669" stroke-width="2.4" marker-end="url(#m_green)"/>

  <!-- 06: service ↔ transport (跨业务到网络 P2P) -->
  <path d="M780,416 L1220,416" fill="none" stroke="#ea580c" stroke-width="2.4" marker-start="url(#m_orange_back)" marker-end="url(#m_orange)"/>

  <!-- 08: transport ↔ signalserver (垂直直连) -->
  <path d="M1350,380 L1350,312" fill="none" stroke="#ea580c" stroke-width="2.4" marker-start="url(#m_orange_back)" marker-end="url(#m_orange)"/>

  <!-- 07: transport ↔ peerjs (垂直直连) -->
  <path d="M1350,452 L1350,575" fill="none" stroke="#ea580c" stroke-width="2.4" marker-start="url(#m_orange_back)" marker-end="url(#m_orange)"/>

  <!-- 04: service → repository (业务层读写 SQLite 元数据库) -->
  <path d="M580,452 L580,488 L290,488 L290,575" fill="none" stroke="#7c3aed" stroke-width="2.4" marker-end="url(#m_purple)"/>

  <!-- 10: controller → storage (控制器上传直接写入 storage 磁盘) -->
  <path d="M380,452 L380,466 L620,466 L620,575" fill="none" stroke="#7c3aed" stroke-width="2.4" marker-end="url(#m_purple)"/>

  <!-- 11: transport ↔ storage (P2P 传输落盘与对外供流读取) -->
  <path d="M1220,442 L830,442 L830,611 L760,611" fill="none" stroke="#7c3aed" stroke-width="2.4" marker-start="url(#m_purple_back)" marker-end="url(#m_purple)"/>

  <!-- 09: controller → downloader (控制器下载直连多协议下载器) -->
  <path d="M210,452 L210,705 L650,705 L650,755" fill="none" stroke="#7c3aed" stroke-width="2.4" marker-end="url(#m_purple)"/>

  <!-- 13: media-node → ech (内部直连) -->
  <path d="M1350,791 L1390,791" fill="none" stroke="#64748b" stroke-width="2.4" marker-end="url(#m_slate)"/>

  <!-- ============ 边标签（无压盖，错位排布） ============ -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans CJK SC', 'Source Han Sans SC', 'Microsoft YaHei', sans-serif" font-size="11.5" font-weight="700">
    <!-- 01 -->
    <rect x="557" y="190" width="186" height="30" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="650" y="210" fill="#2563eb" text-anchor="middle">01 frontend ↔ backend</text>

    <!-- 12 -->
    <rect x="987" y="121" width="226" height="30" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="1100" y="141" fill="#2563eb" text-anchor="middle">12 frontend ↔ signalserver</text>

    <!-- 02 -->
    <rect x="339" y="261" width="132" height="30" rx="8" fill="#ffffff" stroke="#059669" stroke-width="1.5"/>
    <text x="405" y="281" fill="#059669" text-anchor="middle">02 router → controller</text>

    <!-- 05 (左侧空旷区域) -->
    <rect x="130" y="281" width="174" height="30" rx="8" fill="#ffffff" stroke="#059669" stroke-width="1.5"/>
    <text x="217" y="301" fill="#059669" text-anchor="middle">05 router ↔ source</text>

    <!-- 03 -->
    <rect x="428" y="401" width="124" height="30" rx="8" fill="#ffffff" stroke="#059669" stroke-width="1.5"/>
    <text x="490" y="421" fill="#059669" text-anchor="middle">03 controller → service</text>

    <!-- 06 -->
    <rect x="918" y="401" width="144" height="30" rx="8" fill="#ffffff" stroke="#ea580c" stroke-width="1.5"/>
    <text x="990" y="421" fill="#ea580c" text-anchor="middle">06 service ↔ transport</text>

    <!-- 08 -->
    <rect x="1253" y="331" width="194" height="30" rx="8" fill="#ffffff" stroke="#ea580c" stroke-width="1.5"/>
    <text x="1350" y="351" fill="#ea580c" text-anchor="middle">08 transport ↔ signalserver</text>

    <!-- 07 -->
    <rect x="1287" y="500" width="126" height="30" rx="8" fill="#ffffff" stroke="#ea580c" stroke-width="1.5"/>
    <text x="1350" y="520" fill="#ea580c" text-anchor="middle">07 transport ↔ peerjs</text>

    <!-- 10 (controller → storage 上层，偏右) -->
    <rect x="430" y="451" width="176" height="30" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="518" y="471" fill="#7c3aed" text-anchor="middle">10 controller → storage</text>

    <!-- 04 (service → repository 下层，偏左) -->
    <rect x="330" y="473" width="186" height="30" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="423" y="493" fill="#7c3aed" text-anchor="middle">04 service → repository</text>

    <!-- 11 -->
    <rect x="858" y="500" width="174" height="30" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="945" y="520" fill="#7c3aed" text-anchor="middle">11 transport ↔ storage</text>

    <!-- 09 (底部走廊) -->
    <rect x="290" y="690" width="196" height="30" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="388" y="710" fill="#7c3aed" text-anchor="middle">09 controller → downloader</text>

    <!-- 13 -->
    <rect x="1300" y="735" width="150" height="30" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
    <text x="1375" y="755" fill="#64748b" text-anchor="middle">13 media-node → ech</text>
  </g>

  <!-- ============ 图例与连接清单 ============ -->
  <rect x="40" y="885" width="1520" height="295" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans CJK SC', 'Source Han Sans SC', 'Microsoft YaHei', sans-serif">
    <text x="60" y="915" font-size="15" font-weight="700" fill="#0f172a">图例与架构分面</text>

    <line x1="60" y1="945" x2="104" y2="945" stroke="#2563eb" stroke-width="2.4" marker-end="url(#m_blue)"/>
    <text x="118" y="950" font-size="13" font-weight="700" fill="#1e3a8a">前端接入面</text>

    <line x1="60" y1="980" x2="104" y2="980" stroke="#059669" stroke-width="2.4" marker-end="url(#m_green)"/>
    <text x="118" y="985" font-size="13" font-weight="700" fill="#064e3b">进程内业务 / 管理注入</text>

    <line x1="60" y1="1015" x2="104" y2="1015" stroke="#ea580c" stroke-width="2.4" marker-end="url(#m_orange)"/>
    <text x="118" y="1020" font-size="13" font-weight="700" fill="#7c2d12">P2P / WebRTC 面</text>

    <line x1="60" y1="1050" x2="104" y2="1050" stroke="#7c3aed" stroke-width="2.4" marker-end="url(#m_purple)"/>
    <text x="118" y="1055" font-size="13" font-weight="700" fill="#3b0764">本地存储与持久化面</text>

    <line x1="60" y1="1085" x2="104" y2="1085" stroke="#64748b" stroke-width="2.4" marker-end="url(#m_slate)"/>
    <text x="118" y="1090" font-size="13" font-weight="700" fill="#334155">media-node 模块内部耦合</text>

    <rect x="60" y="1110" width="50" height="20" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.2" stroke-dasharray="6 3"/>
    <text x="118" y="1125" font-size="12" fill="#334155">虚线框 = 横切依赖，不计入 13 条连接：01 config（配置装配）· 14 nodestate（共享运行态）</text>

    <rect x="60" y="1140" width="50" height="20" rx="6" fill="#faf5ff" stroke="#a855f7" stroke-width="1.2" stroke-dasharray="6 3"/>
    <text x="118" y="1155" font-size="12" fill="#6d28d9">紫色大虚线框 = 本地存储聚合区（02 repository SQLite 元数据 + 03 storage 磁盘内容寻址）</text>

    <text x="480" y="915" font-size="15" font-weight="700" fill="#0f172a">连接清单 · 双向 7 条 · 单向 6 条</text>

    <g font-size="12.5">
      <text x="480" y="945" fill="#2563eb" font-weight="700">01</text><text x="508" y="945" fill="#334155">frontend ↔ backend　本地 WS /ws/peer，控制面 + 数据面</text>
      <text x="480" y="971" fill="#059669" font-weight="700">02</text><text x="508" y="971" fill="#334155">router → controller　HTTP handler 调 controller，无回调</text>
      <text x="480" y="997" fill="#059669" font-weight="700">03</text><text x="508" y="997" fill="#334155">controller → service　进程内同步调用，错误经返回值回流</text>
      <text x="480" y="1023" fill="#7c3aed" font-weight="700">04</text><text x="508" y="1023" fill="#334155">service → repository　SQLite 读写元数据，无回调</text>
      <text x="480" y="1049" fill="#059669" font-weight="700">05</text><text x="508" y="1049" fill="#334155">router ↔ source　SetSourceManager 注入 + FileRouter 反向</text>
      <text x="480" y="1075" fill="#ea580c" font-weight="700">06</text><text x="508" y="1075" fill="#334155">service ↔ transport　拉文件 / 发 share 帧，回调反向调 service</text>
      <text x="480" y="1101" fill="#ea580c" font-weight="700">07</text><text x="508" y="1101" fill="#334155">transport ↔ peerjs　进程内调用 + DataChannel 全双工</text>
    </g>

    <g font-size="12.5">
      <text x="1060" y="945" fill="#ea580c" font-weight="700">08</text><text x="1088" y="945" fill="#334155">transport ↔ signalserver　信令 WS + 发现 HTTP</text>
      <text x="1060" y="971" fill="#7c3aed" font-weight="700">09</text><text x="1088" y="971" fill="#334155">controller → downloader　单协议探测，三件套返回值</text>
      <text x="1060" y="997" fill="#7c3aed" font-weight="700">10</text><text x="1088" y="997" fill="#334155">controller → storage　上传写盘 + 路径安全校验</text>
      <text x="1060" y="1023" fill="#7c3aed" font-weight="700">11</text><text x="1088" y="1023" fill="#334155">transport ↔ storage　P2P 拉取落盘 + serveFile 对外供流</text>
      <text x="1060" y="1049" fill="#2563eb" font-weight="700">12</text><text x="1088" y="1049" fill="#334155">frontend ↔ signalserver　信令 WS 拨号 + 发现 HTTP</text>
      <text x="1060" y="1075" fill="#64748b" font-weight="700">13</text><text x="1088" y="1075" fill="#334155">media-node → ech　ECH 域名前置，无回调</text>
      <text x="1060" y="1101" fill="#64748b" font-style="italic">　↔ = 存在 B→A 回调；→ = B 侧不回调 A</text>
    </g>
  </g>
</svg>
