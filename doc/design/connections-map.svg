<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="1180" viewBox="0 0 1560 1180">
  <defs>
    <marker id="m_blue" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto" markerOverflow="visible"><path d="M0,1 L13,7 L0,13 Z" fill="#2563eb"/></marker>
    <marker id="m_green" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto" markerOverflow="visible"><path d="M0,1 L13,7 L0,13 Z" fill="#059669"/></marker>
    <marker id="m_purple" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto" markerOverflow="visible"><path d="M0,1 L13,7 L0,13 Z" fill="#7c3aed"/></marker>
    <marker id="m_orange" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto" markerOverflow="visible"><path d="M0,1 L13,7 L0,13 Z" fill="#ea580c"/></marker>
    <marker id="m_slate" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto" markerOverflow="visible"><path d="M0,1 L13,7 L0,13 Z" fill="#64748b"/></marker>
    <marker id="m_blue_back" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="1" refY="7" orient="auto" markerOverflow="visible"><path d="M13,1 L0,7 L13,13 Z" fill="#2563eb"/></marker>
    <marker id="m_green_back" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="1" refY="7" orient="auto" markerOverflow="visible"><path d="M13,1 L0,7 L13,13 Z" fill="#059669"/></marker>
    <marker id="m_purple_back" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="1" refY="7" orient="auto" markerOverflow="visible"><path d="M13,1 L0,7 L13,13 Z" fill="#7c3aed"/></marker>
    <marker id="m_orange_back" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="1" refY="7" orient="auto" markerOverflow="visible"><path d="M13,1 L0,7 L13,13 Z" fill="#ea580c"/></marker>
  </defs>

  <rect x="0" y="0" width="1560" height="1180" fill="#ffffff"/>

  <!-- ============ 顶部标题与说明 ============ -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans CJK SC', 'Source Han Sans SC', 'Microsoft YaHei', sans-serif">
    <text x="40" y="34" font-size="26" font-weight="700" fill="#0f172a">peerdrive 连接拓扑 · 14 模块 / 13 连接</text>
    <text x="40" y="60" font-size="13" fill="#64748b">箭头 = 主动调用方 → 被调用方　·　两头箭头 = 存在 B→A 回调 / 反向通道　·　虚线框 = 横切依赖（不计入 13 条连接）</text>
    <text x="1520" y="34" font-size="13" font-weight="700" fill="#0f172a" text-anchor="end">13 / 13 连接　·　14 / 14 模块</text>
    <text x="1520" y="60" font-size="13" fill="#64748b" text-anchor="end">依据 doc/design/connections/*.md</text>
  </g>

  <!-- ============ 模块框（14 模块） ============ -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans CJK SC', 'Source Han Sans SC', 'Microsoft YaHei', sans-serif">
    <!-- Row 1: y=100..172 -->
    <rect x="60" y="100" width="260" height="72" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.5" stroke-dasharray="7 4"/>
    <text x="190" y="128" font-size="15" font-weight="700" fill="#92400e" text-anchor="middle">01 · config 配置</text>
    <text x="190" y="152" font-size="11" fill="#a16207" text-anchor="middle">internal/config</text>

    <rect x="520" y="100" width="260" height="72" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
    <text x="650" y="128" font-size="15" font-weight="700" fill="#1e3a8a" text-anchor="middle">13 · frontend Web 面板</text>
    <text x="650" y="152" font-size="11" fill="#1d4ed8" text-anchor="middle">front/ (React + Vite)</text>

    <!-- Row 2: y=260..332 -->
    <rect x="380" y="260" width="260" height="72" rx="10" fill="#f0fdf4" stroke="#059669" stroke-width="1.8"/>
    <text x="510" y="288" font-size="15" font-weight="700" fill="#064e3b" text-anchor="middle">04 · router 路由与中间件</text>
    <text x="510" y="312" font-size="11" fill="#047857" text-anchor="middle">internal/router</text>

    <rect x="1180" y="260" width="260" height="72" rx="10" fill="#ecfeff" stroke="#0891b2" stroke-width="1.8"/>
    <text x="1310" y="288" font-size="15" font-weight="700" fill="#155e75" text-anchor="middle">11 · signalserver 信令发现</text>
    <text x="1310" y="312" font-size="11" fill="#0e7490" text-anchor="middle">back/signalserver</text>

    <!-- Row 3: y=420..492 -->
    <rect x="60" y="420" width="260" height="72" rx="10" fill="#f0fdf4" stroke="#059669" stroke-width="1.8"/>
    <text x="190" y="448" font-size="15" font-weight="700" fill="#064e3b" text-anchor="middle">05 · controller 处理器</text>
    <text x="190" y="472" font-size="11" fill="#047857" text-anchor="middle">internal/controller</text>

    <rect x="470" y="420" width="260" height="72" rx="10" fill="#f0fdf4" stroke="#059669" stroke-width="1.8"/>
    <text x="600" y="448" font-size="15" font-weight="700" fill="#064e3b" text-anchor="middle">06 · service 业务层</text>
    <text x="600" y="472" font-size="11" fill="#047857" text-anchor="middle">internal/service</text>

    <rect x="930" y="420" width="260" height="72" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="1.8"/>
    <text x="1060" y="448" font-size="15" font-weight="700" fill="#7c2d12" text-anchor="middle">09 · transport P2P 传输</text>
    <text x="1060" y="472" font-size="11" fill="#c2410c" text-anchor="middle">internal/transport</text>

    <!-- Row 4: y=580..652 -->
    <rect x="60" y="580" width="260" height="72" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.8"/>
    <text x="190" y="608" font-size="15" font-weight="700" fill="#3b0764" text-anchor="middle">02 · repository 元数据库</text>
    <text x="190" y="632" font-size="11" fill="#6d28d9" text-anchor="middle">internal/repository · SQLite</text>

    <rect x="470" y="580" width="260" height="72" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.8"/>
    <text x="600" y="608" font-size="15" font-weight="700" fill="#3b0764" text-anchor="middle">03 · storage 内容寻址存储</text>
    <text x="600" y="632" font-size="11" fill="#6d28d9" text-anchor="middle">internal/pathutil · FileIndex</text>

    <rect x="930" y="580" width="260" height="72" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="1.8"/>
    <text x="1060" y="608" font-size="15" font-weight="700" fill="#7c2d12" text-anchor="middle">10 · peerjs 协议库</text>
    <text x="1060" y="632" font-size="11" fill="#c2410c" text-anchor="middle">back/peerjs</text>

    <!-- Row 5: y=760..832 -->
    <rect x="60" y="760" width="260" height="72" rx="10" fill="#f0fdf4" stroke="#059669" stroke-width="1.8"/>
    <text x="190" y="788" font-size="15" font-weight="700" fill="#064e3b" text-anchor="middle">07 · source 文件来源</text>
    <text x="190" y="812" font-size="11" fill="#047857" text-anchor="middle">internal/source · Manager</text>

    <rect x="470" y="760" width="260" height="72" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.8"/>
    <text x="600" y="788" font-size="15" font-weight="700" fill="#3b0764" text-anchor="middle">08 · downloader 多协议下载</text>
    <text x="600" y="812" font-size="11" fill="#6d28d9" text-anchor="middle">internal/downloader</text>

    <rect x="880" y="760" width="260" height="72" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.5" stroke-dasharray="7 4"/>
    <text x="1010" y="788" font-size="15" font-weight="700" fill="#92400e" text-anchor="middle">14 · nodestate 运行时状态</text>
    <text x="1010" y="812" font-size="11" fill="#a16207" text-anchor="middle">internal/nodestate</text>

    <rect x="1180" y="760" width="150" height="72" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.8"/>
    <text x="1255" y="788" font-size="14" font-weight="700" fill="#1e293b" text-anchor="middle">12 · media-node</text>
    <text x="1255" y="812" font-size="11" fill="#475569" text-anchor="middle">back/cmd/media-node</text>

    <rect x="1390" y="760" width="150" height="72" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.8"/>
    <text x="1465" y="788" font-size="14" font-weight="700" fill="#1e293b" text-anchor="middle">ech</text>
    <text x="1465" y="812" font-size="11" fill="#475569" text-anchor="middle">ECH 域名前置</text>
  </g>

  <!-- ============ 连接边（13 条） ============ -->
  <!-- 01: frontend ↔ backend (router) -->
  <path d="M620,172 L620,215 L510,215 L510,260" fill="none" stroke="#2563eb" stroke-width="2.4" marker-start="url(#m_blue_back)" marker-end="url(#m_blue)"/>

  <!-- 12: frontend ↔ signalserver -->
  <path d="M780,136 L1240,136 L1240,260" fill="none" stroke="#2563eb" stroke-width="2.4" marker-start="url(#m_blue_back)" marker-end="url(#m_blue)"/>

  <!-- 02: router → controller -->
  <path d="M440,332 L440,375 L190,375 L190,420" fill="none" stroke="#059669" stroke-width="2.4" marker-end="url(#m_green)"/>

  <!-- 05: router ↔ source (清爽走左侧空白通道，避免跨越全图) -->
  <path d="M380,296 L40,296 L40,796 L60,796" fill="none" stroke="#059669" stroke-width="2.4" marker-start="url(#m_green_back)" marker-end="url(#m_green)"/>

  <!-- 03: controller → service -->
  <path d="M320,456 L470,456" fill="none" stroke="#059669" stroke-width="2.4" marker-end="url(#m_green)"/>

  <!-- 06: service ↔ transport -->
  <path d="M730,456 L930,456" fill="none" stroke="#ea580c" stroke-width="2.4" marker-start="url(#m_orange_back)" marker-end="url(#m_orange)"/>

  <!-- 08: transport ↔ signalserver -->
  <path d="M1130,420 L1130,375 L1240,375 L1240,332" fill="none" stroke="#ea580c" stroke-width="2.4" marker-start="url(#m_orange_back)" marker-end="url(#m_orange)"/>

  <!-- 07: transport ↔ peerjs -->
  <path d="M1060,492 L1060,580" fill="none" stroke="#ea580c" stroke-width="2.4" marker-start="url(#m_orange_back)" marker-end="url(#m_orange)"/>

  <!-- 10: controller → storage (在 y=524，与 04 分开，不重叠) -->
  <path d="M260,492 L260,524 L540,524 L540,580" fill="none" stroke="#7c3aed" stroke-width="2.4" marker-end="url(#m_purple)"/>

  <!-- 04: service → repository (在 y=556，与 10 分开，不重叠) -->
  <path d="M500,492 L500,556 L190,556 L190,580" fill="none" stroke="#7c3aed" stroke-width="2.4" marker-end="url(#m_purple)"/>

  <!-- 11: transport ↔ storage -->
  <path d="M980,492 L980,542 L800,542 L800,616 L730,616" fill="none" stroke="#7c3aed" stroke-width="2.4" marker-start="url(#m_purple_back)" marker-end="url(#m_purple)"/>

  <!-- 09: controller → downloader (平滑垂直走廊通道，不倒穿 controller) -->
  <path d="M300,492 L300,504 L340,504 L340,796 L470,796" fill="none" stroke="#7c3aed" stroke-width="2.4" marker-end="url(#m_purple)"/>

  <!-- 13: media-node → ech -->
  <path d="M1330,796 L1390,796" fill="none" stroke="#64748b" stroke-width="2.4" marker-end="url(#m_slate)"/>

  <!-- ============ 边标签（无压盖，错位排布） ============ -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans CJK SC', 'Source Han Sans SC', 'Microsoft YaHei', sans-serif" font-size="11.5" font-weight="700">
    <!-- 01 -->
    <rect x="427" y="199" width="186" height="32" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="520" y="220" fill="#2563eb" text-anchor="middle">01 frontend ↔ backend</text>

    <!-- 12 -->
    <rect x="897" y="120" width="226" height="32" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="1010" y="141" fill="#2563eb" text-anchor="middle">12 frontend ↔ signalserver</text>

    <!-- 02 -->
    <rect x="249" y="359" width="132" height="32" rx="8" fill="#ffffff" stroke="#059669" stroke-width="1.5"/>
    <text x="315" y="380" fill="#059669" text-anchor="middle">02 router → controller</text>

    <!-- 05 (放在左侧横向空位) -->
    <rect x="120" y="280" width="174" height="32" rx="8" fill="#ffffff" stroke="#059669" stroke-width="1.5"/>
    <text x="207" y="301" fill="#059669" text-anchor="middle">05 router ↔ source</text>

    <!-- 03 -->
    <rect x="333" y="440" width="124" height="32" rx="8" fill="#ffffff" stroke="#059669" stroke-width="1.5"/>
    <text x="395" y="461" fill="#059669" text-anchor="middle">03 controller → service</text>

    <!-- 06 -->
    <rect x="758" y="440" width="144" height="32" rx="8" fill="#ffffff" stroke="#ea580c" stroke-width="1.5"/>
    <text x="830" y="461" fill="#ea580c" text-anchor="middle">06 service ↔ transport</text>

    <!-- 08 -->
    <rect x="1088" y="359" width="194" height="32" rx="8" fill="#ffffff" stroke="#ea580c" stroke-width="1.5"/>
    <text x="1185" y="380" fill="#ea580c" text-anchor="middle">08 transport ↔ signalserver</text>

    <!-- 07 -->
    <rect x="997" y="520" width="126" height="32" rx="8" fill="#ffffff" stroke="#ea580c" stroke-width="1.5"/>
    <text x="1060" y="541" fill="#ea580c" text-anchor="middle">07 transport ↔ peerjs</text>

    <!-- 10 (controller → storage 上层，偏右) -->
    <rect x="340" y="508" width="176" height="32" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="428" y="529" fill="#7c3aed" text-anchor="middle">10 controller → storage</text>

    <!-- 04 (service → repository 下层，偏左，完全错开) -->
    <rect x="210" y="540" width="186" height="32" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="303" y="561" fill="#7c3aed" text-anchor="middle">04 service → repository</text>

    <!-- 11 -->
    <rect x="818" y="526" width="174" height="32" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="905" y="547" fill="#7c3aed" text-anchor="middle">11 transport ↔ storage</text>

    <!-- 09 (垂直走廊正中) -->
    <rect x="250" y="695" width="196" height="32" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="348" y="716" fill="#7c3aed" text-anchor="middle">09 controller → downloader</text>

    <!-- 13 -->
    <rect x="1265" y="730" width="190" height="32" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
    <text x="1360" y="751" fill="#64748b" text-anchor="middle">13 media-node → ech</text>
  </g>

  <!-- ============ 图例 ============ -->
  <rect x="40" y="880" width="1480" height="260" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans CJK SC', 'Source Han Sans SC', 'Microsoft YaHei', sans-serif">
    <text x="60" y="908" font-size="15" font-weight="700" fill="#0f172a">图例</text>

    <line x1="60" y1="938" x2="104" y2="938" stroke="#2563eb" stroke-width="2.4" marker-end="url(#m_blue)"/>
    <text x="118" y="943" font-size="13" font-weight="700" fill="#1e3a8a">前端接入面</text>

    <line x1="60" y1="974" x2="104" y2="974" stroke="#059669" stroke-width="2.4" marker-end="url(#m_green)"/>
    <text x="118" y="979" font-size="13" font-weight="700" fill="#064e3b">进程内业务 / 管理注入</text>

    <line x1="60" y1="1010" x2="104" y2="1010" stroke="#ea580c" stroke-width="2.4" marker-end="url(#m_orange)"/>
    <text x="118" y="1015" font-size="13" font-weight="700" fill="#7c2d12">P2P / WebRTC 面</text>

    <line x1="60" y1="1046" x2="104" y2="1046" stroke="#7c3aed" stroke-width="2.4" marker-end="url(#m_purple)"/>
    <text x="118" y="1051" font-size="13" font-weight="700" fill="#3b0764">数据持久化面</text>

    <line x1="60" y1="1082" x2="104" y2="1082" stroke="#64748b" stroke-width="2.4" marker-end="url(#m_slate)"/>
    <text x="118" y="1087" font-size="13" font-weight="700" fill="#334155">media-node 模块内部耦合</text>

    <rect x="60" y="1104" width="50" height="20" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.2" stroke-dasharray="6 3"/>
    <text x="118" y="1119" font-size="12" fill="#334155">虚线框 = 横切依赖，不计入 13 条连接：01 config（cfg 注入各层）· 14 nodestate（transport/service 读写运行时状态）</text>

    <text x="440" y="908" font-size="15" font-weight="700" fill="#0f172a">连接清单　双向 7 条　·　单向 6 条</text>

    <g font-size="12.5">
      <text x="440" y="938" fill="#2563eb" font-weight="700">01</text><text x="468" y="938" fill="#334155">frontend ↔ backend　本地 WS /ws/peer，控制面 + 数据面</text>
      <text x="440" y="964" fill="#059669" font-weight="700">02</text><text x="468" y="964" fill="#334155">router → controller　HTTP handler 调 controller，无回调</text>
      <text x="440" y="990" fill="#059669" font-weight="700">03</text><text x="468" y="990" fill="#334155">controller → service　进程内同步调用，错误经返回值回流</text>
      <text x="440" y="1016" fill="#7c3aed" font-weight="700">04</text><text x="468" y="1016" fill="#334155">service → repository　SQLite 读写，repository 不回调</text>
      <text x="440" y="1042" fill="#059669" font-weight="700">05</text><text x="468" y="1042" fill="#334155">router ↔ source　SetSourceManager 注入 + FileRouter 反向</text>
      <text x="440" y="1068" fill="#ea580c" font-weight="700">06</text><text x="468" y="1068" fill="#334155">service ↔ transport　拉文件 / 发 share 帧，回调反向调 service</text>
      <text x="440" y="1094" fill="#ea580c" font-weight="700">07</text><text x="468" y="1094" fill="#334155">transport ↔ peerjs　进程内调用 + DataChannel 全双工</text>
    </g>

    <g font-size="12.5">
      <text x="1030" y="938" fill="#ea580c" font-weight="700">08</text><text x="1058" y="938" fill="#334155">transport ↔ signalserver　信令 WS + 发现 HTTP</text>
      <text x="1030" y="964" fill="#7c3aed" font-weight="700">09</text><text x="1058" y="964" fill="#334155">controller → downloader　单协议探测，三件套返回值</text>
      <text x="1030" y="990" fill="#7c3aed" font-weight="700">10</text><text x="1058" y="990" fill="#334155">controller → storage　A→B 写 + 读经返回值回流</text>
      <text x="1030" y="1016" fill="#7c3aed" font-weight="700">11</text><text x="1058" y="1016" fill="#334155">transport ↔ storage　拉取落盘 + serveFile 对外服务</text>
      <text x="1030" y="1042" fill="#2563eb" font-weight="700">12</text><text x="1058" y="1042" fill="#334155">frontend ↔ signalserver　信令 WS 拨号 + 发现 HTTP</text>
      <text x="1030" y="1068" fill="#64748b" font-weight="700">13</text><text x="1058" y="1068" fill="#334155">media-node → ech　ECH 域名前置，无回调</text>
      <text x="1030" y="1094" fill="#64748b" font-style="italic">　↔ = 存在 B→A 回调；→ = B 侧不回调 A</text>
    </g>
  </g>
</svg>
